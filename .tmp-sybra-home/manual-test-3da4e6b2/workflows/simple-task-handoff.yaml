id: simple-task-handoff
name: Simple Task — Handoff
description: A task handed off from an external tool (e.g. Orca) that already carries the approved plan in its body/plan. Skip triage and planning entirely; flip the task straight to in-progress so simple-task-implement runs the implementation agent. The cascade in OnWorkflowComplete picks up the status_changed event.
trigger:
    "on": task.created
    conditions:
        - field: task.tags
          operator: contains
          value: handoff
        - field: task.tags
          operator: not_contains
          value: handoff-review
        - field: task.tags
          operator: not_contains
          value: handoff-testing
        - field: task.tags
          operator: not_contains
          value: handoff-ready-pr
        - field: task.tags
          operator: not_contains
          value: review
steps:
    - id: set_in_progress
      name: Hand Off to Implement
      type: set_status
      config:
        status: in-progress
      next:
        - goto: ""
builtin: true
