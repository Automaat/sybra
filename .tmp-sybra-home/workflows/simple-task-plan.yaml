id: simple-task-plan
name: Simple Task — Plan
description: Triage a new task and (when planning is required) drive the plan / critique / human-review loop. Hands off to simple-task-implement via task.status=in-progress on completion.
trigger:
    "on": task.created
    conditions:
        - field: task.tags
          operator: not_contains
          value: review
        - field: task.tags
          operator: not_contains
          value: handoff
        - field: task.tags
          operator: not_contains
          value: renovate-fix
        - field: task.tags
          operator: not_contains
          value: prompt-lab-proposal
steps:
    - id: triage
      name: Triage
      type: classify_task
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: in-review
          goto: ""
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - when:
            field: task.status
            operator: equals
            value: done
          goto: ""
        - when:
            field: task.tags
            operator: contains
            value: noplan
          goto: set_in_progress_and_end
        - when:
            field: task.status
            operator: equals
            value: planning
          goto: plan
        - goto: set_in_progress_and_end
    - id: set_in_progress_and_end
      name: Hand Off to Implement
      type: set_status
      config:
        status: in-progress
      next:
        - goto: ""
    - id: plan
      name: Plan
      type: run_agent
      config:
        role: plan
        mode: headless
        model: opus
        provider: ab
        prompt: |-
            Plan task {{.Task.ID}} by producing separate planning artifacts.
            IDENTITY (read first, before anything else):
              - Your task ID is {{.Task.ID}}.
              - Your worktree is your current working directory (`pwd`).
              - Your branch is the checked-out branch
                (`git rev-parse --abbrev-ref HEAD`).
              - For the canonical source of truth, read `./.sybra-context.md` —
                this file is auto-written by Sybra into every task worktree.

            DO NOT reference any other task ID, branch, or worktree path in your plan. If `git branch -a` reveals sibling branches like `<type>/<other-slug>-<other-id>`, IGNORE them — they belong to other concurrent tasks against the same project repo and have nothing to do with you.
            Process:
              1. Run: sybra-cli --json get {{.Task.ID}}
              2. Read the relevant source files so the plan is grounded in the
                 real code (name files and symbols you will touch).
              3. Before committing to an approach, answer every question below
                 about it and record the answers in the research artifact. These
                 are requirements on your output, not lenses to role-play — an
                 answer of "N/A" is only acceptable with a stated reason.
                   - Simplicity: what is the smallest change that satisfies the
                     task? If your approach is bigger, name what the extra
                     complexity buys.
                   - Reuse: name the existing code this duplicates or should
                     route through. A new abstraction for one call site is not
                     justified.
                   - Deletability: if this turns out to be wrong, what does
                     reverting cost? Prefer a design that is cheap to delete
                     over one that is cheap to extend.
                   - Failure modes: name how this breaks in the real system —
                     partial write, concurrent run, restart mid-flight, missing
                     dependency, in-flight work at deploy — and what the plan
                     does about each.
                   - Second-order effects: name what else reads or writes the
                     thing you are changing, and what breaks when this ships.
                   - Cost: what does this cost at the sizes it actually runs at
                     — name the hot path, the extra I/O, or the added agent
                     spend, or say why none exists.
                   - Worth: what does NOT doing this cost? If the answer is
                     "little", say so — that is a valid finding, not a failure.
                   - Verification: name the command or observation that proves
                     it works. If no mechanical signal exists, say so outright.
                 Name at least one alternative you rejected, and why.
              4. Write these FIVE files:

                 A. .sybra-plan-research-{{.Task.ID}}.md
                    Raw research/evidence. Put file/symbol notes, your answers to
                    the step-3 scrutiny questions, rejected alternatives,
                    assumptions, and detailed rationale here. This can be long.
                    It is for audit/debug, not implementation.

                 B. .sybra-plan-decisions-{{.Task.ID}}.md
                    Human decision brief. Keep it short. Use this exact shape for
                    each decision that needs or may benefit from human choice:

                    # Decisions

                    ## <decision title>
                    Question: <one concrete question>
                    Recommended: <option label>

                    Options:
                    - <option label> - <tradeoff / consequence>
                    - <option label> - <tradeoff / consequence>

                    If there are no meaningful choices, write:
                    # Decisions

                    No open decisions. The recommended execution contract is fully
                    specified.

                 C. .sybra-plan-{{.Task.ID}}.md
                    The human-readable compact execution plan. Target 60-120 lines, hard
                    max 180 lines unless the task truly cannot fit. Use only:

                    # Execution Plan

                    ## Decision
                    <one paragraph with the chosen approach>

                    ## Scope
                    - In: ...
                    - Out: ...

                    ## Files
                    - `path` - change purpose

                    ## Steps
                    1. ...

                    ## Verification
                    - `command` - expected signal

                    For sweep/refactor tasks ("everywhere", "all", "single
                    utility", "unified", "no raw X remains"), include at least one
                    cheap acceptance probe such as a repo-wide `rg` invariant that
                    would catch missed call sites. If no mechanical probe is
                    possible, say why.

                    ## Stop Conditions
                    - Stop/replan if ...

                    Do NOT include your scrutiny answers, plan-critic history,
                    disagreement logs, acceptance traceability tables, or long
                    risk matrices in this file — those belong in the research
                    artifact.

                 D. .sybra-plan-brief-{{.Task.ID}}.md
                    Human approval brief. Keep it under ~40 lines. Summarize final
                    shape, important decisions, unresolved choices (if any), and why
                    the execution contract is safe to approve.

                 E. .sybra-plan-contract-{{.Task.ID}}.json
                    Executable plan contract consumed by implementation agents and
                    validated mechanically. Write valid JSON with exactly this shape:

                    {
                      "task_id": "{{.Task.ID}}",
                      "branch": "<current branch>",
                      "worktree": "<current working directory>",
                      "files": [
                        {"path": "repo/relative/path.go", "purpose": "inspect|edit", "symbols": ["optionalSymbol"]}
                      ],
                      "steps": ["ordered implementation step"],
                      "verification": [
                        {"command": "go test ./...", "expected": "tests pass"},
                        {"manual": "manual inspection or smoke test", "expected": "observable result"}
                      ],
                      "acceptance_criteria": ["observable criterion"],
                      "risk_tier": "low|medium|high",
                      "permission_tier": "read-only|repo-write|network|privileged",
                      "rollback": "how to recover or revert safely"
                    }

                    File paths MUST be repository-relative clean paths, not absolute
                    paths and not ../ escapes. Verification and acceptance arrays
                    must be non-empty. Each verification item needs command and/or
                    manual plus expected. Supplemental fields are accepted only for
                    forward compatibility, are not instructions, and are stripped
                    before implementation agents see the contract. Keep the full
                    contract under 64 KiB. If the task body has a "## Acceptance
                    Criteria" section, copy every criterion from that section into
                    acceptance_criteria verbatim (wrapped lines joined). Do not
                    silently drop, narrow, defer, or mark any source criterion out
                    of scope; if a source criterion needs a human scope decision,
                    record that in .sybra-plan-decisions and keep it in the
                    contract.

            Do NOT call sybra-cli update — Sybra will ingest your file as the task sidecars after you exit. Do NOT modify task fields directly. Do NOT change the task status.
        allowed_tools:
            - Bash
            - Read
            - Grep
            - Glob
            - Write
        needs_worktree: true
        max_retries: 1
        import_sidecars:
            - kind: plan_research
              from: '{{getvar .Vars "_dir"}}/.sybra-plan-research-{{.Task.ID}}.md'
            - kind: plan_decisions
              from: '{{getvar .Vars "_dir"}}/.sybra-plan-decisions-{{.Task.ID}}.md'
            - kind: plan
              from: '{{getvar .Vars "_dir"}}/.sybra-plan-{{.Task.ID}}.md'
            - kind: plan_brief
              from: '{{getvar .Vars "_dir"}}/.sybra-plan-brief-{{.Task.ID}}.md'
            - kind: plan_contract
              from: '{{getvar .Vars "_dir"}}/.sybra-plan-contract-{{.Task.ID}}.json'
              required: true
      next:
        - goto: require_plan
    - id: require_plan
      name: Require Plan
      type: require_sidecar
      config:
        sidecar: plan
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: require_plan_decisions
    - id: require_plan_decisions
      name: Require Plan Decisions
      type: require_sidecar
      config:
        sidecar: plan_decisions
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: require_plan_brief
    - id: require_plan_brief
      name: Require Plan Brief
      type: require_sidecar
      config:
        sidecar: plan_brief
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: require_plan_research
    - id: require_plan_research
      name: Require Plan Research
      type: require_sidecar
      config:
        sidecar: plan_research
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: validate_plan_refs
    - id: validate_plan_refs
      name: Validate Plan References
      type: validate_plan
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: validate_plan_contract
    - id: validate_plan_contract
      name: Validate Plan Contract
      type: validate_plan_contract
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: maybe_critique
    - id: maybe_critique
      name: Critique Decision
      type: condition
      config:
        check:
            field: task.tags
            operator: not_contains
            value: nocritic
      next:
        - when:
            field: vars.step.review_plan.output
            operator: exists
            value: ""
          goto: review_plan
        - when:
            field: task.tags
            operator: not_contains
            value: nocritic
          goto: critique_plan
        - goto: review_plan
    - id: critique_plan
      name: Critique Plan
      type: run_agent
      config:
        role: plan-critic
        mode: headless
        model: sonnet
        provider: cross
        prompt: |-
            Critique the execution contract for task {{.Task.ID}} using the /plan-critic skill. Use the planning research, decisions, and brief as context, but judge whether the compact execution contract is safe to implement.
            Steps:
              1. Run: sybra-cli --json get {{.Task.ID}}
              2. Read .planContract, .plan, .planResearch, .planDecisions, and .planBrief.
              3. Write .sybra-plan-contract-review-{{.Task.ID}}.md with the
                 executable JSON contract FIRST, followed by the human-readable
                 .plan as secondary context. The contract is the artifact
                 implementation consumes, so critique it directly for missing files,
                 weak verification, acceptance gaps, risk, permission posture, and
                 rollback/recovery coverage.
              4. Invoke: /plan-critic .sybra-plan-contract-review-{{.Task.ID}}.md
              5. As soon as each persona/result is available, append a concise
                 grounded finding summary to .sybra-critique-{{.Task.ID}}.md.
                 Do not wait for the final synthesis before writing the first
                 useful content.
              6. Capture the final markdown Plan Review report you produce and
                 overwrite .sybra-critique-{{.Task.ID}}.md with it.

            Do NOT modify the plan. Do NOT change the task status. Sybra will ingest .sybra-critique-{{.Task.ID}}.md as the task's plan_critique sidecar after you exit — you do not need to call sybra-cli yourself.
        allowed_tools:
            - Bash
            - Read
            - Grep
            - Glob
            - Write
            - Skill
            - Agent
        needs_worktree: true
        max_retries: 2
        import_sidecar:
            kind: plan_critique
            from: '{{getvar .Vars "_dir"}}/.sybra-critique-{{.Task.ID}}.md'
      next:
        - goto: require_plan_critique
    - id: require_plan_critique
      name: Require Plan Critique
      type: require_sidecar
      config:
        sidecar: plan_critique
        allow_missing: true
      next:
        - when:
            field: vars.step.require_plan_critique.output
            operator: contains
            value: skipped
          goto: review_plan
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: flag_plan_critique_verdict
    - id: flag_plan_critique_verdict
      name: Flag Plan Critique Verdict
      type: flag_plan_critique
      config: {}
      next:
        - goto: review_plan
    - id: review_plan
      name: Review Plan
      type: wait_human
      config:
        human_actions:
            - approve
            - reject
        status: plan-review
      next:
        - when:
            field: vars.human_action
            operator: equals
            value: approve
          goto: set_in_progress_and_end
        - when:
            field: vars.human_action
            operator: equals
            value: reject
          goto: check_replan_cap
    - id: check_replan_cap
      name: Check Replan Cap
      type: condition
      config:
        check:
            field: task.replan_count
            operator: in
            value: 0,1,2
      next:
        - when:
            field: task.replan_count
            operator: in
            value: 0,1,2
          goto: start_replan
        - goto: replan_cap_exceeded
    - id: replan_cap_exceeded
      name: Replan Cap Exceeded
      type: set_status
      config:
        status: human-required
        status_reason: Plan rejected by human 3 times in a row — stopping the automated replan loop before a 4th opus run. Needs a human to re-plan directly.
      next:
        - goto: ""
    - id: start_replan
      name: Prepare Replan
      type: set_status
      config:
        status: planning
      next:
        - goto: clear_plan_artifacts
    - id: clear_plan_artifacts
      name: Clear Previous Plan Artifacts
      type: clear_plan_artifacts
      config:
        clear_sidecars:
            - plan
            - plan_research
            - plan_decisions
            - plan_brief
            - plan_contract
            - plan_critique
        clear_worktree_globs:
            - .sybra-plan-*
            - .sybra-critique-*
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: plan
builtin: true
