id: pr-fix
name: PR Fix
description: Fix CI failures or merge conflicts on a PR
trigger:
    "on": pr.event
    conditions:
        - field: pr.issue_kind
          operator: in
          value: conflict,ci_failure,comments
steps:
    - id: set_in_progress
      name: Mark In Progress
      type: set_status
      config:
        status: in-progress
      next:
        - goto: fix
    - id: fix
      name: Fix PR Issue
      type: run_agent
      config:
        role: pr-fix
        mode: headless
        model: sonnet
        prompt: '{{ getvar .Vars "prompt" }}'
      next:
        - goto: route_pr_fix_result
    - id: route_pr_fix_result
      name: Route PR Fix Result
      type: route_pr_fix_result
      config: {}
      next:
        - when:
            field: vars.step.route_pr_fix_result.pr_fix_test_fix_eligible
            operator: equals
            value: "true"
          goto: test_fix
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - when:
            field: task.status
            operator: equals
            value: in-review
          goto: ""
        - goto: verify_commits
    - id: test_fix
      name: Fix Reported Test Failures
      type: run_agent
      config:
        role: test-fix
        mode: headless
        model: sonnet
        prompt: |-
            A prior pr-fix agent working this task found these specific test failures unrelated to the merge itself and stopped rather than freelance outside its scope:

            {{ getvar .Vars "step.fix.pr_fix_failing_tests" }}

            Reported reason: {{ getvar .Vars "step.fix.pr_fix_reason" }}

            Fix ONLY what is needed to make the tests named above pass. No new investigation beyond these named failures, no unrelated changes — the same scope discipline pr-fix itself follows. Re-run exactly those tests (or their containing package, if that is the smallest reproducible unit) and confirm they pass before reporting success. If fixing them would require more than a narrow, targeted change — a design decision, missing context you cannot reconstruct, or touching code beyond the named tests — stop without pushing further changes and report human-required rather than guessing.

            Once the named tests pass, commit (git commit -s -S) and push the fix back to this same PR branch:
            ```sh PUSH_REMOTE=origin if git config --get remote.fork.url >/dev/null; then PUSH_REMOTE=fork; fi PUSH_URL=$(git remote get-url --push "$PUSH_REMOTE") case "$PUSH_URL" in https://github.com/*|http://github.com/*|https://github.com:[0-9]*/*|http://github.com:[0-9]*/*) gh auth status --hostname github.com >/dev/null ;; esac git push "$PUSH_REMOTE" HEAD:{{.Task.Branch}} ```
            Do not force-push or rewrite existing commits — this branch already has a PR open against it; a plain push is always expected to succeed since you only added a commit on top. {{ getvar .Vars "pr_fix_result_contract" }}
      next:
        - goto: route_test_fix_result
    - id: route_test_fix_result
      name: Route Test Fix Result
      type: route_pr_fix_result
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - when:
            field: task.status
            operator: equals
            value: in-review
          goto: ""
        - goto: verify_commits
    - id: verify_commits
      name: Verify Commits
      type: verify_commits
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - when:
            field: task.status
            operator: equals
            value: done
          goto: ""
        - goto: detect_tampering
    - id: detect_tampering
      name: Detect Test Tampering
      type: detect_tampering
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: link_pr_and_review
    - id: link_pr_and_review
      name: Link PR and Review
      type: link_pr_and_review
      config: {}
      next:
        - when:
            field: task.status
            operator: equals
            value: in-review
          goto: ensure_pr_closes_issue
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: evaluate
    - id: evaluate
      name: Evaluate Fix
      type: evaluate
      config: {}
      next:
        - goto: ""
    - id: ensure_pr_closes_issue
      name: Ensure PR Closes Issue
      type: ensure_pr_closes_issue
      config: {}
      next:
        - goto: rerequest_review
    - id: rerequest_review
      name: Re-request Review
      type: rerequest_review
      config: {}
      next:
        - goto: ""
builtin: true
