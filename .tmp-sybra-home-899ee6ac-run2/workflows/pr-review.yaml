id: pr-review
name: PR Review
description: Run code review agent on a pull request
trigger:
    "on": task.created
    conditions:
        - field: task.tags
          operator: contains
          value: review
        - field: task.tags
          operator: not_contains
          value: handoff-pr
        - field: task.pr_number
          operator: not_equals
          value: ""
steps:
    - id: triage_review
      name: Triage Review
      type: triage_review
      config: {}
      next:
        - goto: set_in_progress
    - id: set_in_progress
      name: Set In Progress
      type: set_status
      config:
        status: in-progress
      next:
        - goto: pick_review_method
    - id: pick_review_method
      name: Pick Review Method
      type: condition
      config: {}
      next:
        - when:
            field: task.tags
            operator: contains
            value: force-staff-review
          goto: review_staff
        - when:
            field: vars.step.triage_review.output
            operator: equals
            value: simple
          goto: review_simple
        - goto: review_staff
    - id: review_simple
      name: Review PR (adversarial)
      type: run_agent
      config:
        role: review
        mode: headless
        model: sonnet
        provider: cross
        prompt: |-
            Run /adversarial-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}
            This task is an authorized Sybra PR review for the linked project. Do not ask the operator for confirmation before posting your review.
            If PR #{{.Task.PRNumber}} does not exist or cannot be fetched (e.g. `gh pr view {{.Task.PRNumber}} --repo {{.Task.ProjectID}}` 404s), do NOT treat this as a completed review. Instead run `sybra-cli update {{.Task.ID}} --status human-required --status-reason "pr-review: PR #{{.Task.PRNumber}} not found"` and stop.
            You have no approval authority: NEVER submit an APPROVE review event. Do not run `gh pr review --approve` and do not submit `event=APPROVE` via `gh api`. REQUEST_CHANGES and COMMENT are feedback, not approval authority, so submit those directly instead of leaving them pending.
            Before posting, fetch the PR head SHA and existing reviews; if a review for that head already contains the Sybra harness footer, do not create another review.
            Use GitHub's review API so findings become inline comments, not one aggregated comment. Add each blocking correctness issue as a `comments` entry on the changed line it applies to. Put only the short verdict and summary in the review body.
            Post via `gh api repos/{{.Task.ProjectID}}/pulls/{{.Task.PRNumber}}/reviews -X POST ...` with explicit `-f`/`-F` fields such as `comments[][path]`, `comments[][line]`, `comments[][side]=RIGHT`, and `comments[][body]`, then choose the event by verdict:
            - At least one blocking finding: submit with `-f event=REQUEST_CHANGES`. - No blocking finding but the review has notes worth surfacing: submit with `-f event=COMMENT`. - Nothing to say at all (fully clean, no findings): omit `event` so GitHub leaves the review PENDING for a human to approve.
            End the review summary and every review comment you post with a blank line then exactly this standalone harness attribution footer:
            _Generated by Sybra harness_
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: set_in_review
    - id: review_staff
      name: Review PR (staff)
      type: run_agent
      config:
        role: review
        mode: headless
        model: sonnet
        provider: cross
        prompt: |-
            Run /staff-code-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}
            This task is an authorized Sybra PR review for the linked project. Do not ask the operator for confirmation before posting your review.
            If PR #{{.Task.PRNumber}} does not exist or cannot be fetched (e.g. `gh pr view {{.Task.PRNumber}} --repo {{.Task.ProjectID}}` 404s), do NOT treat this as a completed review. Instead run `sybra-cli update {{.Task.ID}} --status human-required --status-reason "pr-review: PR #{{.Task.PRNumber}} not found"` and stop.
            You have no approval authority: NEVER submit an APPROVE review event. Do not run `gh pr review --approve` and do not submit `event=APPROVE` via `gh api`. REQUEST_CHANGES and COMMENT are feedback, not approval authority, so submit those directly instead of leaving them pending.
            Before posting, fetch the PR head SHA and existing reviews; if a review for that head already contains the Sybra harness footer, do not create another review.
            Use GitHub's review API so findings become inline comments, not one aggregated comment. Add each blocking correctness issue as a `comments` entry on the changed line it applies to. Put only the short verdict and summary in the review body.
            Post via `gh api repos/{{.Task.ProjectID}}/pulls/{{.Task.PRNumber}}/reviews -X POST ...` with explicit `-f`/`-F` fields such as `comments[][path]`, `comments[][line]`, `comments[][side]=RIGHT`, and `comments[][body]`, then choose the event by verdict:
            - At least one blocking finding: submit with `-f event=REQUEST_CHANGES`. - No blocking finding but the review has notes worth surfacing: submit with `-f event=COMMENT`. - Nothing to say at all (fully clean, no findings): omit `event` so GitHub leaves the review PENDING for a human to approve.
            End the review summary and every review comment you post with a blank line then exactly this standalone harness attribution footer:
            _Generated by Sybra harness_
      next:
        - when:
            field: task.status
            operator: equals
            value: human-required
          goto: ""
        - goto: set_in_review
    - id: set_in_review
      name: Set In Review
      type: set_status
      config:
        status: in-review
      next:
        - goto: ""
builtin: true
