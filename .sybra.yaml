# Repo-level sybra config. Every machine that checks out this repo applies
# the `setup` commands in each new worktree and wires the `checks` as git
# hooks — no per-machine UI tweaks required.

# Setup commands run (in order) in every newly created worktree root with a
# 5-min batch timeout; failures abort worktree creation so agents never
# start on a broken toolchain. Repo-declared commands run first, then any
# machine-local SetupCommands from ~/.sybra/projects/<id>.yaml.
setup:
  - mise install
  - (cd frontend && npm ci)
  - (cd frontend && npm run build:desktop)

# Black-box testing guidance for the testing workflow. Test-runners must prefer
# this runnable surface over static inspection: start the server, wait for
# health, then drive at least one user/operator-facing probe.
manual_test:
  kind: server
  command: export SYBRA_PORT=${SYBRA_MANUAL_TEST_PORT:-$((49152 + RANDOM % 10000))}; printf '%s\n' "$SYBRA_PORT" > .sybra-manual-test-port; go run ./cmd/sybra-server
  health_url: http://127.0.0.1:$SYBRA_PORT/health
  probe_commands:
    - PORT=$(cat .sybra-manual-test-port); curl -fsS "http://127.0.0.1:${PORT}/health"

# Git hooks installed by sybra into every worktree on creation.
#
# Every command is routed through `mise exec --` so the hook resolves tools
# via the project's mise.toml even when PATH isn't set up in the agent's
# shell (e.g. on the headless server container, where mise activation is
# not done per-invocation). For this to work the project's
# SetupCommands must include `mise install` AND `(cd frontend && npm ci)` —
# otherwise the hook fails with "tool not found" at commit time, which was
# the aa9ba123 failure mode (see CLAUDE.md Server Deployment section).
checks:
  pre_commit:
    - mise exec -- golangci-lint run ./...
    - (cd frontend && npx oxlint .)
    - mise exec -- hadolint Dockerfile
  pre_push:
    - mise exec -- go test ./...
    - (cd frontend && npm run check)
  # Verify suite run by the verify_checks workflow step (reward-hacking
  # phase 2): runs on the agent's branch HEAD before review so an
  # implementation that does not pass its own tests cannot reach a PR. Scoped
  # to ./internal/... ./cmd/... because the root package's
  # //go:embed all:frontend/dist needs a frontend build that worktrees don't
  # run; the internal+cmd packages compile without it and hold the logic under
  # test.
  verify:
    - mise exec -- go test ./internal/... ./cmd/...
