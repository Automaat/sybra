name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The main-branch merge queue creates a synthetic commit containing the
  # queued group. Required checks must run for this event or GitHub cannot
  # prove that independently-green PRs are green in combination. Keep this in
  # sync with .github/BRANCH_PROTECTION.md.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install Linux process sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - name: Run Go tests
        run: go test -race -timeout 5m ./...

  test-go-darwin:
    name: Go Sandbox Tests (macOS)
    # The seatbelt profile, its write roots, and the darwin-only paths around
    # them are exercised by tests that skip on a host without sandbox-exec, so
    # ubuntu runs green over a suite that covered none of it. That is how a
    # heredoc failure reached every enforce-mode agent (#3377). Scoped to the
    # sandbox owner rather than the tree: about a minute of runner time, and
    # no frontend build, since nothing here embeds the bundle.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run sandbox tests
        # shell: bash for -o pipefail. Without it the step reports tee's exit
        # status, so a failing suite reads as a passing step — which is what
        # this job did on its first run, over a real darwin failure.
        shell: bash
        run: go test -race -timeout 10m ./internal/agent/... 2>&1 | tee darwin-tests.log

      - name: Fail when the sandbox itself was unavailable
        # A skipped test prints nothing without -v, so a suite that covered
        # nothing reads exactly like one that covered everything. Only a skip
        # that names a missing sandbox counts: a test needing a GPG key or a
        # provider CLI legitimately skips on a runner, and failing on those
        # would make the job noise rather than a signal.
        shell: bash
        run: |
          go test -run 'TestSandboxEnforce|TestOneShotCommand|TestSandboxBreakout' -v ./internal/agent/ \
            2>&1 | tee darwin-sandbox.log
          if grep -qE 'sandbox (mechanism unavailable|-exec not installed)' darwin-sandbox.log; then
            echo "::error::the macOS runner could not build a sandbox; this job proves nothing" >&2
            grep -E 'sandbox (mechanism unavailable|-exec not installed)' darwin-sandbox.log >&2
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestSandboxEnforce' darwin-sandbox.log; then
            echo "::error::no enforce-mode sandbox test ran" >&2
            exit 1
          fi

  test-go-e2e:
    name: Go E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install Linux process sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - name: Pre-fetch Go modules (retried, bounded)
        # go test's own -timeout only bounds test execution, not module
        # download — a proxy/network stall during `go mod download` is only
        # caught by this job's outer 20m timeout-minutes, burning the whole
        # budget on one bad fetch. Bound each attempt short and retry so a
        # transient stall costs seconds, not the whole job.
        run: |
          for i in 1 2 3 4 5; do
            timeout --kill-after=10 120 go mod download && exit 0
            echo "go mod download attempt $i exited $?; retrying" >&2
          done
          echo "go mod download failed after 5 attempts" >&2
          exit 1

      - name: Run Go e2e tests
        run: go test -race -tags e2e -p 1 -timeout 20m ./internal/sybra/...

  test-go-db:
    name: Go Database Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every SQL-backed store's behaviour suite runs against both engines here.
    # Without this job the postgres leg of internal/testutil/dbtest silently
    # skips and sqlite-only SQL reaches an operator's postgres box unreviewed.
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: sybra
          POSTGRES_PASSWORD: sybra
          POSTGRES_DB: sybra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sybra -d sybra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run database-backed store tests on sqlite and postgres
        run: go test -race -timeout 10m ./internal/db/... ./internal/loopagent/... ./internal/testutil/dbtest/...
        env:
          SYBRA_TEST_POSTGRES_DSN: postgres://sybra:sybra@127.0.0.1:5432/sybra?sslmode=disable
          SYBRA_REQUIRE_POSTGRES_TESTS: "1"

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type-check
        run: cd frontend && npm run check

      - name: Build desktop variant
        run: cd frontend && npm run build:desktop

      - name: Build web variant
        run: cd frontend && npm run build:web

      - name: Run unit tests with coverage
        run: cd frontend && npm run test:coverage

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2

  lint-nilaway:
    name: Nilaway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - name: Install nilaway
        # renovate: datasource=go depName=go.uber.org/nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a

      - name: Run nilaway
        run: |
          NILAWAY_BASELINE=0
          set +e
          nilaway -include-pkgs="github.com/Automaat/sybra" ./... > nilaway.out 2>&1
          NILAWAY_EXIT=$?
          FINDING_COUNT=$(grep -c '^/' nilaway.out)
          set -e
          if [ "$NILAWAY_EXIT" -ne 0 ] && [ "$FINDING_COUNT" -eq 0 ]; then
            echo "::error::Nilaway exited ${NILAWAY_EXIT} with no parseable findings — crash or package-load failure."
            cat nilaway.out >&2
            exit "$NILAWAY_EXIT"
          fi
          {
            echo "### Nilaway findings"
            echo
            if [ "$FINDING_COUNT" -eq 0 ]; then
              echo "_No issues._"
            else
              echo "<details><summary>${FINDING_COUNT} findings (baseline: ${NILAWAY_BASELINE})</summary>"
              echo
              echo '```'
              cat nilaway.out
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINDING_COUNT" -gt "$NILAWAY_BASELINE" ]; then
            echo "::error::Nilaway: ${FINDING_COUNT} findings exceeds baseline of ${NILAWAY_BASELINE}. Fix new nil-safety regressions before merging."
            exit 1
          fi
          echo "Nilaway: ${FINDING_COUNT}/${NILAWAY_BASELINE} findings — OK"

  lint-dockerfile:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Uses the mise-pinned hadolint rather than hadolint-action's bundled
      # binary. The action shipped an older hadolint than mise.toml, so a
      # Renovate bump of the pin made `mise run verify` fail locally on rules
      # CI never ran — silently red pre-commit hook, green CI. mise.toml is now
      # the only place the version is declared.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # .hadolint.yaml supplies the config and failure-threshold.
      - run: hadolint Dockerfile

  check-wailsjs:
    name: Wails Bindings Sync
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Only same-repo PRs check out the head branch (so regenerated files
          # can be pushed back). Fork PRs and push/tag events resolve to an
          # empty ref and use the default checkout — a fork branch name would
          # not resolve in this repo, and a fork cannot be pushed to.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          # The push step supplies BINDINGS_SYNC_PAT explicitly. If checkout
          # persists its GITHUB_TOKEN extraheader, Git uses that instead and
          # the follow-up PR checks are left action_required by anti-recursion.
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install wails3 CLI
        # Upstream v3 module has a relative `replace` directive that breaks a
        # plain `go install ...@version`. Pulling the deps via `go get` first
        # (so they land in the local module cache without the replace), then
        # installing, is the workaround. The Wails version is read from go.mod
        # so the bindings job follows the app's pinned module version.
        # go.mod/go.sum may shift here but we only diff frontend/bindings/
        # below, so it does not poison the check.
        run: |
          WAILS_VERSION="$(go list -m -f '{{ .Version }}' github.com/wailsapp/wails/v3)"
          go get "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go get "github.com/wailsapp/wails/v3/internal/commands@${WAILS_VERSION}"
          go get "github.com/wailsapp/wails/v3/pkg/doctor-ng/tui@${WAILS_VERSION}"
          go install github.com/wailsapp/wails/v3/cmd/wails3

      - name: Regenerate bindings
        run: wails3 generate bindings -ts -clean -d frontend/bindings ./...

      - name: Regenerate api transport shims
        # gen-api-shim consumes the freshly regenerated bindings, so a new
        # Wails service gets both its binding and its api.ts/api-http.ts shims
        # produced in the same pass.
        run: go run ./cmd/gen-api-shim

      - name: Commit and push regenerated bindings and shims
        # Restricted to same-repo PRs — a fork PR's GITHUB_TOKEN is read-only
        # and falls through to the drift gate.
        #
        # BINDINGS_SYNC_PAT, when set, avoids a GitHub anti-recursion guard:
        # a GITHUB_TOKEN-authored commit leaves the required "CI"/"Wails
        # Bindings Sync" checks permanently `action_required` on this new
        # HEAD instead of running them, so the PR gets stuck until a human
        # clicks "Re-run". Falls back to GITHUB_TOKEN, with that drawback,
        # until the secret exists.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.BINDINGS_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- frontend/bindings/ frontend/src/lib/api.ts frontend/src/lib/api-http.ts; then
            echo "bindings and api shims already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/bindings/ frontend/src/lib/api.ts frontend/src/lib/api-http.ts
          git commit -s -m "chore(bindings): regenerate wails bindings and api shims"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"$HEAD_REF"

      - name: Check for drift
        # Fork PRs and push/tag events cannot auto-commit, so the hard gate
        # stays as the backstop and any drift there still fails red.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code frontend/bindings/ frontend/src/lib/api.ts frontend/src/lib/api-http.ts || \
            (echo "::error::Wails bindings / api shims out of sync. Run 'wails3 generate bindings -ts -d frontend/bindings ./...' and 'go run ./cmd/gen-api-shim'." && exit 1)

  check-api-shim-sync:
    name: API Shim Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check HTTP-allowlisted methods have api.ts/api-http.ts shims
        run: bash scripts/check-api-shim-sync.sh

  check-no-home-fallback:
    name: No Operator-Home Fallbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for ~/.sybra fallbacks outside internal/config
        run: bash scripts/check-no-home-fallback.sh

  check-repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check tracked runtime/build artifacts stay out of the repo
        run: bash scripts/check-repo-hygiene.sh
  check-atomic-writes:
    name: Atomic Record Writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for hand-rolled temp-rename writes outside internal/fsutil
        run: bash scripts/check-atomic-writes.sh

      - name: Check the gate itself still catches drift
        run: bash scripts/check-atomic-writes.test.sh

  check-consolidated-primitives:
    name: Consolidated Primitive Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Check truncation, JSON extraction, task status, and provider boundaries
        run: bash scripts/check-consolidated-primitives.sh

  check-no-viewer-user-endpoint:
    name: No /user Identity Lookups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for /user identity lookups outside viewerLoginE
        run: bash scripts/check-no-viewer-user-endpoint.sh

  check-gh-exec-gate:
    name: gh Calls Routed Through ghGate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for direct gh subprocess spawns outside github.Run/RunWithEnv
        run: bash scripts/check-gh-exec-gate.sh

  check-git-exec-gate:
    name: Git Calls Routed Through gitexec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Check for direct production Git subprocess spawns outside gitexec
        run: |
          bash scripts/check-git-exec-gate.sh
          bash scripts/check-git-exec-gate.test.sh

  check-no-direct-status-write:
    name: No Direct Task-Status Writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Check for direct task.Update{Status: ...} writes outside the transition API"
        run: bash scripts/check-no-direct-status-write.sh

  check-no-direct-workflow-write:
    name: No Direct Task-Workflow Writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Check for direct task.Update{Workflow: ...} writes outside the transition API"
        run: bash scripts/check-no-direct-workflow-write.sh

  test-release-scripts:
    name: Release Scripts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run resolve-release-version.sh tests
        run: bash scripts/resolve-release-version.test.sh

      - name: Run generate-release-notes.sh tests
        run: bash scripts/generate-release-notes.test.sh

  test-deploy-scripts:
    name: Deploy Scripts Tests
    # The deploy artifacts are versioned with the code they support, but until
    # now nothing ran their suite: every scenario — build/rollback/quarantine,
    # the health URL, the TLS board, the AppArmor profile — was covered only by
    # whoever remembered to run it by hand. A defect in them takes the server
    # down on the next restart, so this belongs on the same gate as the code.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run the deploy integration suite
        run: bash deploy/tests/deploy_integration_test.sh

  autonomy-slo:
    name: Autonomy SLO Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run autonomy SLO gate
        run: bash scripts/check-autonomy-slo.sh

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Lint frontend
        run: cd frontend && npm ci && npx oxlint .

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm run build:desktop

      - name: Build desktop binary
        # The repo-root main.go is darwin-gated; macos-15 runner exercises
        # it alongside cmd/sybra-server and the CLIs.
        run: go build ./...

  doc-version-sync:
    name: Doc Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          MISE_GO_VERSION=$(grep '^go = ' mise.toml | awk -F'"' '{print $2}')
          [ "$GO_VERSION" = "$MISE_GO_VERSION" ] || \
            (echo "mise.toml Go version stale (go.mod=$GO_VERSION, mise.toml=$MISE_GO_VERSION)" && exit 1)
          NODE_VERSION=$(grep '^node = ' mise.toml | awk -F'"' '{print $2}')
          grep -q "\"node\": \"$NODE_VERSION\"" frontend/package.json || \
            (echo "frontend/package.json engines.node stale (want $NODE_VERSION)" && exit 1)
          WAILS_RUNTIME_VERSION=$(node -p "require('./frontend/package.json').dependencies['@wailsio/runtime']")
          grep -q "$WAILS_RUNTIME_VERSION" CONTRIBUTING.md || \
            (echo "CONTRIBUTING.md @wailsio/runtime example stale (want $WAILS_RUNTIME_VERSION)" && exit 1)
          MISE_GOLANGCI_LINT_VERSION=$(grep '^golangci-lint = ' mise.toml | awk -F'"' '{print $2}')
          CI_GOLANGCI_LINT_VERSION=$(grep -A1 '^[[:space:]]*# renovate: datasource=github-releases depName=golangci/golangci-lint$' .github/workflows/ci.yml | grep 'version:' | awk '{print $2}' | tr -d 'v')
          [ "$MISE_GOLANGCI_LINT_VERSION" = "$CI_GOLANGCI_LINT_VERSION" ] || \
            (echo "golangci-lint version mismatch (mise.toml=$MISE_GOLANGCI_LINT_VERSION, ci.yml=$CI_GOLANGCI_LINT_VERSION)" && exit 1)

  go-mod-integrity:
    name: Go Module Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify module checksums
        run: go mod verify

      - name: Check for go.mod/go.sum drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || \
            (echo "::error::go.mod or go.sum is out of sync. Run 'go mod tidy'." && exit 1)

  npm-lockfile-integrity:
    name: npm Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify lockfile is in sync with package.json
        run: |
          cd frontend && npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json || \
            (echo "::error::frontend/package-lock.json out of sync. Run 'cd frontend && npm install' and commit the lockfile." && exit 1)

      - name: Enforce frontend pin strategy
        run: cd frontend && node scripts/check-pin-strategy.mjs

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Run govulncheck
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && govulncheck ./...

      - name: Run npm audit
        run: cd frontend && npm ci && npm audit --audit-level moderate

  e2e:
    name: E2E Tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, codex]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium

      - name: Seed e2e fixtures
        run: |
          mkdir -p "$SYBRA_HOME/tasks"
          cp frontend/e2e/fixtures/*.md "$SYBRA_HOME/tasks/"
          # Marker proving this is a disposable e2e home; the suite refuses
          # destructive task cleanup without it (#1576).
          touch "$SYBRA_HOME/.sybra-e2e-home"
          cat > "$SYBRA_HOME/config.yaml" <<EOF
          # This suite seeds fixtures by writing files into the tasks directory, both before startup and, for the watcher test, while the server is already running, and expects a file written directly to disk to be noticed live. A database store only reads rows, not the tasks directory, so it pins the backend it was written against.
          database:
            backend: file
          agent:
            provider: ${{ matrix.provider }}
            # sybra-server refuses to start without an explicit posture, so a
            # config that merely omits the key can never be mistaken for a
            # contained one. "off" is correct here: this suite drives the HTTP
            # API against fake providers and starts no real agent subprocess.
            sandbox_mode: "off"
          server:
            auth_token: e2e-test-token
          monitor:
            stuck_human_hours: 99999
          EOF
        env:
          SYBRA_HOME: /tmp/sybra-e2e

      - name: Build web frontend
        run: cd frontend && npm run build:web
        env:
          VITE_API_TOKEN: e2e-test-token

      - name: Build sybra-server
        run: go build -o bin/sybra-server ./cmd/sybra-server

      - name: Start sybra-server
        run: |
          SYBRA_HOME=/tmp/sybra-e2e \
          SYBRA_STATIC_DIR=frontend/dist-web \
          ./bin/sybra-server > /tmp/sybra-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          echo "Waiting for sybra-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::sybra-server timed out"
              cat /tmp/sybra-server.log
              exit 1
            fi
            sleep 1
          done

      - name: Run fast e2e tests (target ≤5 min)
        run: cd frontend && npx playwright test --grep-invert "@integration"
        env:
          SYBRA_HOME: /tmp/sybra-e2e
          SYBRA_E2E_PROVIDER: ${{ matrix.provider }}

      - name: Write fast test timing summary
        if: always()
        working-directory: frontend
        run: |
          echo "### Fast Tests (${{ matrix.provider }})" >> "$GITHUB_STEP_SUMMARY"
          if test -f test-results/results.json; then node e2e/timing-summary.mjs >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Clear results before integration phase
        if: always()
        run: rm -f frontend/test-results/results.json

      - name: Run integration e2e tests (target ≤10 min)
        run: cd frontend && npx playwright test --grep "@integration"
        env:
          SYBRA_HOME: /tmp/sybra-e2e
          SYBRA_E2E_PROVIDER: ${{ matrix.provider }}

      - name: Write integration test timing summary
        if: always()
        working-directory: frontend
        run: |
          echo "### Integration Tests (${{ matrix.provider }})" >> "$GITHUB_STEP_SUMMARY"
          if test -f test-results/results.json; then node e2e/timing-summary.mjs >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Dump server log
        if: failure()
        run: cat /tmp/sybra-server.log || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.provider }}
          path: frontend/test-results/
          retention-days: 7

  smoke-k3d:
    name: k3d Job Runner Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # The agent image is multi-GB and gets built, loaded into dockerd, then
      # imported into the k3d node — three copies. A stock runner does not have
      # the headroom, and the import OOM-kills the node rather than failing
      # cleanly. These toolchains are not used by this job.
      - name: Free runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      # docker-build.yml cannot supply this image: it is path-filtered to the
      # Dockerfile and uses load: false, so nothing k3d could import survives it.
      # Hence load: true and a build of our own here.
      - name: Build agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: sybra-server:poc
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Via the mise task, which carries the k3d/kubectl pins. Calling the
      # script directly would run against whatever the runner happens to ship.
      - name: Run k3d smoke
        env:
          SMOKE_SKIP_BUILD: "1"
          SMOKE_CLUSTER: sybra-ci
        run: mise run smoke:k3d
