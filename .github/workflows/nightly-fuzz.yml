name: Nightly Fuzz & Stress

on:
  schedule:
    - cron: "27 3 * * *" # 03:27 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: task-parser, pkg: ./internal/task/,  fn: FuzzParseBytes }
          - { name: scrub,       pkg: ./internal/scrub/, fn: FuzzScrub }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-

      - name: Run ${{ matrix.target.fn }} for 5m
        run: go test -run XXX -fuzz=${{ matrix.target.fn }} -fuzztime=5m ${{ matrix.target.pkg }}

      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ matrix.target.name }}
          path: ${{ matrix.target.pkg }}testdata/fuzz/
          retention-days: 30

  stress-workflow:
    name: Workflow Engine Stress (-race -count=20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Build frontend (needed for go:embed)
        run: cd frontend && npm ci && npm run build:desktop

      - name: Stress workflow engine
        run: go test -race -count=20 -timeout 15m ./internal/workflow/...

      - name: Stress agent
        run: go test -race -count=20 -timeout 15m ./internal/agent/...
