<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
    <meta charset="UTF-8" />
    <!-- The policy comes from the response header internal/httpserve sets, in
         both binaries. A meta copy here would be a second source of truth that
         silently wins wherever it is stricter: its connect-src 'self' blocked
         every call a window attached to a board on another machine makes,
         whatever the header allowed. Only the vite dev server delivers this
         file without the header. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#110e0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sybra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <title>Sybra</title>
</head>
<body>
<div id="app"></div>
<!-- Served by internal/httpserve: names the board this bundle came from, and
     hands a same-host UI its bearer token. Must load before the app script. -->
<script src="/runtime-config.js"></script>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
