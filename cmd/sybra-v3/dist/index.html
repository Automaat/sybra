<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sybra (v3)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b2636;
            color: #e8e8e8;
            margin: 0;
            padding: 2rem;
        }
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
        h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: #93c5fd; }
        code {
            background: #0f1620;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        pre {
            background: #0f1620;
            padding: 0.75rem;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.8rem;
        }
        .ok { color: #6ee7b7; }
        .err { color: #f87171; }
    </style>
</head>
<body>
    <h1>Sybra v3 swap-the-bootstrap</h1>
    <p>v2 services running on the Wails v3 alpha runtime. Frontend regen
       (Phase 4) will replace this page with the real Svelte app.</p>

    <h2>InfoService.GetVersion</h2>
    <pre id="info">loading...</pre>

    <h2>StatsService.GetStats</h2>
    <pre id="stats">loading...</pre>

    <h2>App.ListBackgroundOps</h2>
    <pre id="bgops">loading...</pre>

    <script type="module">
        import { Call } from "/wails/runtime.js";

        const base = "github.com/Automaat/sybra/internal/sybra";

        async function show(elemId, fqn) {
            const el = document.getElementById(elemId);
            try {
                const v = await Call.ByName(fqn);
                el.innerHTML = `<span class="ok">OK</span>\n${JSON.stringify(v, null, 2)}`;
            } catch (e) {
                el.innerHTML = `<span class="err">FAIL</span> ${e}`;
            }
        }

        await Promise.all([
            show("info",  `${base}.InfoService.GetVersion`),
            show("stats", `${base}.StatsService.GetStats`),
            show("bgops", `${base}.App.ListBackgroundOps`),
        ]);
    </script>
</body>
</html>
