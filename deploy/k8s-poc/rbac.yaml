apiVersion: v1
kind: ServiceAccount
metadata:
  name: sybra-server
  namespace: sybra-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sybra-agent-runner
  namespace: sybra-poc
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sybra-agent-runner
  namespace: sybra-poc
subjects:
  - kind: ServiceAccount
    name: sybra-server
    namespace: sybra-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sybra-agent-runner
