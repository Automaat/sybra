apiVersion: v1
kind: ConfigMap
metadata:
  name: sybra-config
  namespace: sybra-poc
data:
  config.yaml: |
    agent:
      provider: opencode
      model: openrouter/deepseek/deepseek-v4-flash
      mode: headless
      max_concurrent: 2
      require_permissions: false
      survive_restart: false
      sandbox_mode: "off"
      headless_steerable: false
      k8s_jobs:
        enabled: true
        mode: provider
        namespace: sybra-poc
        image: sybra-server:poc
        ttl_seconds_after_finished: 300
        # Longer TTL for a Failed Job, patched on by the runner once it
        # observes the failure — see "Job cleanup and log retention" in
        # README.md. Omit to fall back to the built-in 86400s default.
        failed_ttl_seconds_after_finished: 86400
        secret_env:
          - name: OPENROUTER_API_KEY
            secret_name: sybra-provider-api-keys
            secret_key: openrouter_api_key
          - name: GITHUB_TOKEN
            secret_name: sybra-provider-api-keys
            secret_key: github_token
        volumes:
          - name: sybra-home
            claim_name: sybra-home
            mount_path: /home/sybra/.sybra
          - name: sybra-clones
            claim_name: sybra-clones
            mount_path: /home/sybra/.sybra/clones
          - name: sybra-worktrees
            claim_name: sybra-worktrees
            mount_path: /home/sybra/.sybra/worktrees
    ab_testing:
      enabled: false
    providers:
      claude:
        enabled: false
      codex:
        enabled: false
      copilot:
        enabled: false
      opencode:
        enabled: true
    # agent-only: the provider-mode smoke starts its agent explicitly via
    # App.StartAgent, so nothing here should auto-orchestrate or auto-dispatch.
    orchestrator:
      role: agent-only
    github:
      enabled: false
    renovate:
      enabled: false
    umbrella:
      enabled: false
