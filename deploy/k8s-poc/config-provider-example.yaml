apiVersion: v1
kind: ConfigMap
metadata:
  name: sybra-config
  namespace: sybra-poc
data:
  config.yaml: |
    agent:
      provider: opencode
      model: openrouter/deepseek/deepseek-v4-flash
      mode: headless
      max_concurrent: 2
      require_permissions: false
      survive_restart: false
      sandbox_mode: "off"
      headless_steerable: false
      k8s_jobs:
        enabled: true
        mode: provider
        namespace: sybra-poc
        image: sybra-server:poc
        ttl_seconds_after_finished: 300
        secret_env:
          - name: OPENROUTER_API_KEY
            secret_name: sybra-provider-api-keys
            secret_key: openrouter_api_key
          - name: GITHUB_TOKEN
            secret_name: sybra-provider-api-keys
            secret_key: github_token
        volumes:
          - name: sybra-home
            claim_name: sybra-home
            mount_path: /home/sybra/.sybra
    ab_testing:
      enabled: false
    providers:
      claude:
        enabled: false
      codex:
        enabled: false
      copilot:
        enabled: false
      opencode:
        enabled: true
    github:
      enabled: false
    todoist:
      enabled: false
    renovate:
      enabled: false
    umbrella:
      enabled: false
