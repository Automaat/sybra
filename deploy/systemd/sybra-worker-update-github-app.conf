# Optional GitHub App drop-in, installed as
# /etc/systemd/system/sybra-worker-update.service.d/zz-github-app.conf
# (zz-: it must override an older credentials.conf PAT drop-in).
# The helper refuses any updater path with a non-root ancestor, so both
# files live in the root-owned /usr/local/lib/sybra/bin.

[Service]
EnvironmentFile=
EnvironmentFile=/etc/sybra/sybra.env
EnvironmentFile=/etc/sybra/sybra-agentd.env
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/local/lib/sybra/bin/sybra-worker-github-auth.py
