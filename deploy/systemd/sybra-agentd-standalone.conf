# Optional drop-in for an execution-only host. No board process is started or
# required. Install as sybra-agentd.service.d/standalone.conf after staging a
# separately validated binary at /opt/sybra/worker-current/sybra-agentd.
[Unit]
After=
After=network-online.target
PartOf=

[Service]
WorkingDirectory=/opt/sybra/worker-current
ExecStart=
ExecStart=/usr/bin/env PATH=/home/sybra/.local/share/mise/installs/node/24/bin:/home/sybra/.local/bin:/home/sybra/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /opt/sybra/worker-current/sybra-agentd -config /etc/sybra/sybra-agentd.yaml
