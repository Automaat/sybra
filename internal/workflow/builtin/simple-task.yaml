id: simple-task
name: Simple Task
description: Triage, plan or implement, evaluate, review
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: not_contains
      value: review
steps:
  - id: triage
    name: Triage
    type: run_agent
    config:
      role: triage
      mode: headless
      model: sonnet
      max_retries: 3
      prompt: >-
        Triage task {{.Task.ID}} using /sybra-triage skill.
        Get the task with sybra-cli, analyze it, assign tags, mode, and update status.
        IMPORTANT: if the task title is a URL (e.g. a GitHub issue/PR link),
        you MUST fetch the real title from that URL using gh and update the task title
        to a human-readable summary. Never leave a raw URL as the task title.
      allowed_tools:
        - Bash
        - Read
        - Skill
    next:
      # Short-circuit when triage determined the task is already past
      # implementation (e.g. PR already open, escalated, or done). Without
      # these guards the workflow would clobber the status in set_in_progress
      # and dispatch a duplicate implement step.
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ""
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - when:
          field: task.status
          operator: equals
          value: done
        goto: ""
      - when:
          field: task.status
          operator: equals
          value: planning
        goto: plan
      - goto: set_in_progress

  # Dual-provider planning: Claude and Codex generate plans in parallel,
  # each as a headless one-shot writing its raw output to a per-child
  # plan_draft sidecar (auto-keyed by child step ID). The convergence step
  # below merges the drafts via /plan-fork into the canonical plan field.
  #
  # Adding a third provider = adding a third entry in `parallel`. No code
  # changes to the engine or sidecar layer.
  - id: plan
    name: Plan (parallel)
    type: parallel
    parallel:
      - id: plan_claude
        name: Plan (Claude)
        type: run_agent
        config:
          role: plan
          provider: claude
          mode: headless
          model: opus
          needs_worktree: true
          max_retries: 1
          prompt: >-
            Plan task {{.Task.ID}} using the /sybra-plan skill.

            Steps:
              1. Run: sybra-cli --json get {{.Task.ID}}
              2. Read the codebase and produce a detailed implementation plan
                 that names files, symbols (with `path:line` references), the
                 ordered steps, and per-step verification criteria.
              3. Write the full plan markdown to /tmp/sybra-plan-draft-{{.Step.ID}}-{{.Task.ID}}.md

            Do NOT call sybra-cli update — Sybra will ingest your file as the
            plan_draft.{{.Step.ID}} sidecar after you exit. Do NOT modify the
            task plan field. Do NOT change the task status.
          allowed_tools:
            - Bash
            - Read
            - Grep
            - Glob
            - Write
            - Skill
            - Agent
          import_sidecar:
            kind: plan_draft
            from: /tmp/sybra-plan-draft-{{.Step.ID}}-{{.Task.ID}}.md
      - id: plan_codex
        name: Plan (Codex)
        type: run_agent
        config:
          role: plan
          provider: codex
          mode: headless
          needs_worktree: true
          max_retries: 1
          prompt: >-
            Plan task {{.Task.ID}}.

            Steps:
              1. Run: sybra-cli --json get {{.Task.ID}} — read the task
                 title, body, and project context.
              2. Read the relevant source files. Produce a detailed
                 implementation plan that names: file paths, symbols with
                 `path:line` references, ordered steps, and per-step
                 verification criteria (test command + expected outcome).
              3. Write the full plan markdown to /tmp/sybra-plan-draft-{{.Step.ID}}-{{.Task.ID}}.md

            Do NOT call sybra-cli update — Sybra will ingest your file as the
            plan_draft.{{.Step.ID}} sidecar after you exit. Do NOT modify the
            task plan field or status.
          import_sidecar:
            kind: plan_draft
            from: /tmp/sybra-plan-draft-{{.Step.ID}}-{{.Task.ID}}.md
    next:
      - goto: converge_plans

  # Converge the parallel drafts into a single synthesized plan via the
  # /plan-fork skill. Runs on whichever provider Sybra defaults to, since
  # /plan-fork is a Claude Code skill that nests /plan-critic for the final
  # gate.
  - id: converge_plans
    name: Converge Plans
    type: run_agent
    config:
      role: plan
      mode: headless
      model: sonnet
      needs_worktree: true
      max_retries: 1
      prompt: >-
        Converge the parallel plan drafts for task {{.Task.ID}} into a
        single synthesized plan via /plan-fork.

        Drafts (read each one before invoking the skill):
        {{- range $name, $content := .Task.PlanDrafts }}
          - {{$name}}: ~/.sybra/tasks/{{$.Task.ID}}.plan-draft-{{$name}}.md
        {{- end }}

        Steps:
          1. List the available drafts in ~/.sybra/tasks/ with the
             pattern {{.Task.ID}}.plan-draft-*.md
          2. Pick the two drafts (typically plan_claude and plan_codex) and
             invoke:
             /plan-fork <plan-a-path> <plan-b-path> --task {{.Task.ID}} --out /tmp/sybra-plan-{{.Task.ID}}.md
          3. Capture only the synthesized plan markdown to
             /tmp/sybra-plan-{{.Task.ID}}.md (the skill writes there directly
             when --out is passed).

        Sybra will ingest /tmp/sybra-plan-{{.Task.ID}}.md as the task's
        plan sidecar after you exit. Do NOT modify the task plan field
        directly via sybra-cli. Do NOT change the task status.
      allowed_tools:
        - Bash
        - Read
        - Grep
        - Glob
        - Write
        - Skill
        - Agent
      import_sidecar:
        kind: plan
        from: /tmp/sybra-plan-{{.Task.ID}}.md
    next:
      - goto: require_plan

  # Guard: convergence can exit cleanly without producing a plan (e.g.
  # /plan-fork rejected both drafts as broken). Mirrors require_plan_critique
  # below: flips to human-required so the failure is visible instead of
  # silently advancing into critique_plan with an empty plan.
  - id: require_plan
    name: Require Plan
    type: require_sidecar
    config:
      sidecar: plan
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: maybe_critique

  # Branch around critique_plan when the task is tagged `nocritic`, and also
  # on replan iterations after a human reject — the plan has already been
  # critiqued and addressed once; re-critiquing each revision just burns
  # tokens and delays the human review loop. `vars.step.review_plan.output`
  # only exists after the wait_human step has produced a verdict, which is
  # the reliable marker for "this is a replan, not the first pass".
  - id: maybe_critique
    name: Critique Decision
    type: condition
    config:
      check:
        field: task.tags
        operator: not_contains
        value: nocritic
    next:
      - when:
          field: vars.step.review_plan.output
          operator: exists
        goto: review_plan
      - when:
          field: task.tags
          operator: not_contains
          value: nocritic
        goto: critique_plan
      - goto: review_plan

  - id: critique_plan
    name: Critique Plan
    type: run_agent
    config:
      role: plan-critic
      mode: headless
      model: sonnet
      provider: cross
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Critique the plan for task {{.Task.ID}} using the /plan-critic skill.

        Steps:
          1. Run: sybra-cli --json get {{.Task.ID}}
          2. Extract the .plan field from the JSON output and write it to
             /tmp/sybra-plan-{{.Task.ID}}.md
          3. Invoke: /plan-critic /tmp/sybra-plan-{{.Task.ID}}.md
          4. Capture the full markdown Plan Review report you produce and
             write it to /tmp/sybra-critique-{{.Task.ID}}.md

        Do NOT modify the plan. Do NOT change the task status. Sybra
        will ingest /tmp/sybra-critique-{{.Task.ID}}.md as the task's
        plan_critique sidecar after you exit — you do not need to call
        sybra-cli yourself.
      allowed_tools:
        - Bash
        - Read
        - Grep
        - Glob
        - Write
        - Skill
        - Agent
      import_sidecar:
        kind: plan_critique
        from: /tmp/sybra-critique-{{.Task.ID}}.md
    next:
      - goto: require_plan_critique

  # Guard: the critic agent above can exit cleanly even when it never
  # produced its output file (e.g. shell blocked by a sandbox). Without
  # this check the workflow silently advances to address_critique with
  # an empty sidecar, and the human sees only the plan — no critique —
  # in the review UI. Flips task to human-required when the sidecar is
  # empty so the failure is visible.
  - id: require_plan_critique
    name: Require Plan Critique
    type: require_sidecar
    config:
      sidecar: plan_critique
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: reset_for_address

  - id: reset_for_address
    name: Reset for Critique Address
    type: set_status
    config:
      status: planning
    next:
      - goto: address_critique

  - id: address_critique
    name: Address Critique
    type: run_agent
    config:
      role: plan
      mode: interactive
      model: opus
      reuse_agent: true
      wait_for_status: plan-review
      prompt: >-
        The plan critic has reviewed your plan for task {{.Task.ID}}.

        Steps:
          1. sybra-cli --json get {{.Task.ID}} — read the .plan_critique field
          2. For each concern raised, revise the plan to address it
          3. sybra-cli update {{.Task.ID}} --plan "<full revised plan markdown>"
          4. sybra-cli update {{.Task.ID}} --status plan-review

        Then STOP and wait. Do NOT implement.
    next:
      - goto: review_plan

  - id: review_plan
    name: Review Plan
    type: wait_human
    config:
      status: plan-review
      human_actions:
        - approve
        - reject
    next:
      - when:
          field: vars.human_action
          operator: equals
          value: approve
        goto: set_in_progress
      - when:
          field: vars.human_action
          operator: equals
          value: reject
        goto: start_replan

  # Reset status before re-entering `plan` so the plan-review status-change
  # hook fires again when the agent delivers a revised plan. Without this
  # reset the second iteration would already be at plan-review and no
  # transition event would be emitted to advance the workflow.
  - id: start_replan
    name: Prepare Replan
    type: set_status
    config:
      status: planning
    next:
      - goto: plan

  - id: set_in_progress
    name: Start Implementation
    type: set_status
    config:
      status: in-progress
    next:
      - goto: implement

  - id: implement
    name: Implement
    type: run_agent
    config:
      role: implementation
      mode: "{{.Task.AgentMode}}"
      model: sonnet
      prompt: >-
        Implement this task. When done, commit your work and push the branch to
        origin. Do NOT create a PR yet — the PR will be created after local code
        review so that review fixes land in the same branch before it is opened.
        {{- if .Task.Plan}}

        ## Plan

        {{.Task.Plan}}
        {{- end}}
    next:
      - goto: verify_commits

  # Mechanical check (no LLM): verifies the task's branch has at least one
  # commit ahead of origin/main before running eval. Flips to human-required
  # with reason "no commits pushed to branch" when the branch is empty.
  # Skips gracefully when no worktree exists (e.g. task has no project).
  - id: verify_commits
    name: Verify Commits
    type: verify_commits
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: maybe_review

  # Skip review when tagged noreview or already reviewed in a prior run.
  # On skip, jump straight to create_pr so the PR is still opened.
  - id: maybe_review
    name: Review Decision
    type: condition
    config:
      check:
        field: task.tags
        operator: not_contains
        value: noreview
    next:
      - when:
          field: task.reviewed
          operator: equals
          value: "true"
        goto: create_pr
      - when:
          field: task.tags
          operator: not_contains
          value: noreview
        goto: code_review
      - goto: create_pr

  # Review runs locally on the worktree before the PR is created, so fixes
  # are committed to the branch first. No PR URL needed — diff against
  # origin/main captures everything the agent just implemented.
  - id: code_review
    name: Code Review
    type: run_agent
    config:
      role: review
      mode: headless
      provider: cross
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Review the changes on the current branch vs origin/main.
        The PR has not been created yet — review the local diff.

        Steps:
          1. git diff origin/main..HEAD > /tmp/sybra-diff-{{.Task.ID}}.patch
          2. Run /staff-code-review against that patch and the worktree source
          3. Save the full review to /tmp/sybra-review-{{.Task.ID}}.md

        Do NOT submit anything to GitHub. Sybra will ingest
        /tmp/sybra-review-{{.Task.ID}}.md as the code_review sidecar
        after you exit — you do not need to call sybra-cli yourself.
        The /tmp file also remains for the next step (fix_review) to
        read directly.
      import_sidecar:
        kind: code_review
        from: /tmp/sybra-review-{{.Task.ID}}.md
    next:
      - goto: require_code_review

  # Guard: mirrors require_plan_critique above. Flips task to
  # human-required when the review sidecar is empty (e.g. agent never
  # wrote /tmp/sybra-review-…md, or its sandbox blocked the path).
  # Without this, fix_review reads /tmp and the GUI never sees what
  # the reviewer wrote.
  - id: require_code_review
    name: Require Code Review
    type: require_sidecar
    config:
      sidecar: code_review
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: fix_review

  - id: fix_review
    name: Fix Review Comments
    type: run_agent
    config:
      role: fix-review
      mode: headless
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Read the code review at /tmp/sybra-review-{{.Task.ID}}.md

        For each actionable finding (critical/high/medium severity), fix the code.
        Skip low-severity nitpicks and style-only comments.

        When done, commit your changes (do NOT push yet — push happens with PR
        creation). Sign commits with `git commit -s -S`.
        Use conventional commit format: `fix(review): address review comments`.
    next:
      - goto: create_pr

  # Create the GitHub PR after review fixes are committed locally.
  # Check for an existing PR first to stay idempotent on retries.
  - id: create_pr
    name: Create PR
    type: run_agent
    config:
      role: create-pr
      mode: headless
      model: sonnet
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Create a GitHub PR for the current branch if one does not exist yet.

        Steps:
          1. Check: gh pr list --head "$(git branch --show-current)" --json number --jq '.[0].number'
             If a PR number is returned, skip creation — the PR already exists.
          2. If no PR exists, push the branch and create one:
             git push -u origin HEAD
             If push is rejected because the remote has diverged (e.g. after a
             rebase), force-push without asking for confirmation:
             git push --force-with-lease -u origin HEAD
             gh pr create{{if ne .Task.ProjectType "pet"}} --draft{{end}} \
               --title "<conventional-commit title>" \
               --body "<PR body with ## Motivation and ## Implementation information>"
             {{- if .Task.Issue}}
             Include "Closes {{.Task.Issue}}" in the PR body.
             {{- end}}

        PR title must follow conventional commits format matching the task work.
        PR body must have ## Motivation and ## Implementation information sections.
        Never ask for confirmation — this is a feature branch owned by this task.
    next:
      - goto: link_pr_and_review

  # Non-LLM step: recover PR number from task, agent result history, or
  # gh pr list. Sets task to in-review and skips the LLM eval when a PR
  # is unambiguously found. Falls through to evaluate only when all three
  # sources fail to find a PR.
  - id: link_pr_and_review
    name: Link PR and Review
    type: link_pr_and_review
    next:
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ensure_pr_closes_issue
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: evaluate

  # Mechanical fallback (no LLM): reached only when link_pr_and_review failed
  # to find a PR. Walks step history for the last run_agent record and flips
  # the task to human-required with a truncated reason.
  - id: evaluate
    name: Evaluate
    type: evaluate
    next:
      - goto: ""

  # Mechanical check (no LLM): if the task is linked to a GitHub issue,
  # make sure the PR's body carries a `Closes <issue-url>` reference so
  # merging the PR auto-closes the issue. Auto-appends the reference if
  # missing; flips to human-required if the edit/verification fails.
  - id: ensure_pr_closes_issue
    name: Ensure PR Closes Issue
    type: ensure_pr_closes_issue
    next:
      - goto: ""
