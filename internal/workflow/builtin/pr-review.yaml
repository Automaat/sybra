id: pr-review
name: PR Review
description: Run code review agent on a pull request
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: contains
      value: review
    - field: task.tags
      operator: not_contains
      value: handoff-pr
    # "review" is also used as a plain category tag on non-PR bugfix tasks
    # (e.g. tasks about internal/sybra/review itself). Without this, such a
    # task sticks in this workflow forever targeting a nonexistent PR #0,
    # re-dispatching on every status reset (#2627).
    - field: task.pr_number
      operator: not_equals
      value: ""
steps:
  # Clear any prior human-required before launching the review agent.
  # Older inline triage could park tiny PRs on human-required; existing tasks
  # may still carry that status when this workflow resumes.
  - id: set_in_progress
    name: Set In Progress
    type: set_status
    config:
      status: in-progress
    next:
      - goto: review_simple

  # Retired with staff review. Kept so a task parked on one of these at upgrade
  # resumes with a fresh review instead of failing on a missing step.
  - id: triage_review
    name: Retired Triage Review
    type: condition
    next:
      - goto: review_simple

  - id: pick_review_method
    name: Retired Pick Review Method
    type: condition
    next:
      - goto: review_simple

  - id: review_staff
    name: Retired Staff Review
    type: condition
    next:
      - goto: review_simple

  - id: review_simple
    name: Review PR (adversarial)
    type: run_agent
    config:
      role: review
      mode: headless
      model: sonnet
      provider: cross
      # Without this, direct-dispatch verifier setup falls back to an empty
      # temporary cwd and checkout validation fails before an agent is
      # registered.
      needs_worktree: true
      prompt: |-
        {{prreviewprompt .Task.ProjectID .Task.PRNumber}}

        If PR #{{.Task.PRNumber}} does not exist or cannot be fetched (e.g. `gh pr
        view {{.Task.PRNumber}} --repo {{.Task.ProjectID}}` 404s), or the verdict is
        `Review Verdict: FAILED`, do NOT treat this as a completed review. Instead run
        `sybra-cli update {{.Task.ID}} --status human-required --status-reason "pr-review: <the 404 or Gate failure line>"`
        and stop.
    next:
      # If the agent could not find or review the PR it self-escalates to
      # human-required instead of posting, so stop here rather than reporting
      # the review as done (#2647).
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: set_in_review

  - id: set_in_review
    name: Set In Review
    type: set_status
    config:
      status: in-review
    next:
      - goto: ""
