id: pr-review
name: PR Review
description: Run code review agent on a pull request
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: contains
      value: review
    - field: task.tags
      operator: not_contains
      value: handoff-pr
    # "review" is also used as a plain category tag on non-PR bugfix tasks
    # (e.g. tasks about internal/sybra/review itself). Without this, such a
    # task sticks in this workflow forever targeting a nonexistent PR #0,
    # re-dispatching on every status reset (#2627).
    - field: task.pr_number
      operator: not_equals
      value: ""
steps:
  # Clear any prior human-required before launching the review agent.
  # Older inline triage could park tiny PRs on human-required; existing tasks
  # may still carry that status when this workflow resumes.
  - id: set_in_progress
    name: Set In Progress
    type: set_status
    config:
      status: in-progress
    next:
      - goto: review_simple

  - id: review_simple
    name: Review PR (adversarial)
    type: run_agent
    config: &pr_review_config
      role: review
      mode: headless
      model: sonnet
      provider: cross
      # Without this, direct-dispatch verifier setup falls back to an empty
      # temporary cwd and checkout validation fails before an agent is
      # registered.
      needs_worktree: true
      output_schema: >-
        {"type":"object","properties":{"verdict":{"type":"string","enum":["CLEAN","NEEDS_FIXES","FAILED"]}},"required":["verdict"],"additionalProperties":false}
      prompt: |-
        {{prreviewprompt .Task.ProjectID .Task.PRNumber .Task.ID}}
        {{- if getvar .Vars "review_reask_note"}}

        RETRY GUIDANCE: {{getvar .Vars "review_reask_note"}}
        {{- end}}

        Your FINAL message of the turn must be ONLY the schema-valid JSON
        verdict object: `{"verdict":"CLEAN"}`, `{"verdict":"NEEDS_FIXES"}`, or
        `{"verdict":"FAILED"}`.
    next:
      # If the agent could not find or review the PR it self-escalates to
      # human-required instead of posting, so stop here rather than reporting
      # the review as done (#2647).
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: route_review_verdict

  # A FAILED, missing, or malformed verdict never reaches set_in_review: this
  # step's own type retries the review and then escalates.
  - id: route_review_verdict
    name: Route Review Verdict
    type: route_review_verdict
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: set_in_review

  # A task parked on one of these retired IDs at upgrade resumes instead of
  # failing on a missing step.
  - id: triage_review
    name: Triage Review (resumed)
    type: triage_review
    next:
      - goto: review_simple

  - id: pick_review_method
    name: Pick Review Method (resumed)
    type: condition
    next:
      - goto: review_simple

  - id: review_staff
    name: Review PR (adversarial, resumed)
    type: run_agent
    config: *pr_review_config
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: route_review_verdict

  - id: set_in_review
    name: Set In Review
    type: set_status
    config:
      status: in-review
    next:
      - goto: ""
