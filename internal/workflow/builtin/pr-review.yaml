id: pr-review
name: PR Review
description: Run code review agent on a pull request
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: contains
      value: review
    - field: task.tags
      operator: not_contains
      value: handoff-pr
steps:
  # Mechanical heuristic: pick adversarial vs staff review based on PR diff
  # size + shape. Same step type used by simple-task; here it falls back to
  # `gh pr diff` since this workflow has no worktree. Unlike simple-task, this
  # workflow DOES still route to staff on a big+complex diff — the review lands
  # publicly under the operator's name, so depth is worth the spend here.
  - id: triage_review
    name: Triage Review
    type: triage_review
    next:
      - goto: set_in_progress

  # Clear any prior human-required before launching the review agent.
  # Older inline triage could park tiny PRs on human-required; existing tasks
  # may still carry that status when this workflow resumes.
  - id: set_in_progress
    name: Set In Progress
    type: set_status
    config:
      status: in-progress
    next:
      - goto: pick_review_method

  - id: pick_review_method
    name: Pick Review Method
    type: condition
    next:
      - when:
          field: task.tags
          operator: contains
          value: force-staff-review
        goto: review_staff
      - when:
          field: vars.step.triage_review.output
          operator: equals
          value: simple
        goto: review_simple
      - goto: review_staff

  # Orchestration owner: /adversarial-review (internal/skills/data/
  # adversarial-review.md). Below is a thin posting contract (draft reviews,
  # no approvals, attribution footer) — the review methodology lives solely in
  # the skill.
  - id: review_simple
    name: Review PR (adversarial)
    type: run_agent
    config:
      role: review
      mode: headless
      model: sonnet
      provider: cross
      prompt: >-
        Run /adversarial-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}

        This task is an authorized Sybra PR review for the linked project. Do not
        ask the operator for confirmation before posting your review.

        NEVER submit any review event. You have no approval authority, and a
        human must verify and submit the review on GitHub. Do not run
        `gh pr review`, do not run `gh pr review --approve`, and do not submit
        COMMENT, REQUEST_CHANGES, or APPROVE via `gh api`.

        Create exactly one PENDING (draft) pull-request review and leave it
        unsubmitted. Before creating it, fetch the PR head SHA and existing
        reviews; if a review for that head already contains the Sybra harness
        footer, do not create another review.

        Use GitHub's review API so findings become inline comments, not one
        aggregated comment. Add each blocking correctness issue as a `comments`
        entry on the changed line it applies to. Put only the short verdict and
        summary in the draft review body. If the review is clean and has no
        inline findings, create a pending review with the clean summary body and
        no inline comments.

        Prefer `gh api repos/{{.Task.ProjectID}}/pulls/{{.Task.PRNumber}}/reviews
        -X POST ...` with explicit `-f`/`-F` fields such as
        `comments[][path]`, `comments[][line]`, `comments[][side]=RIGHT`, and
        `comments[][body]`. Omit `event` so GitHub leaves the review PENDING.

        End the review summary and every review comment you post with a blank
        line then exactly this standalone harness attribution footer:

        _Generated by Sybra harness_
    next:
      - goto: set_in_review

  # Orchestration owner: /staff-code-review (marketplace plugin skill — no
  # bundled fallback in this repo). Thin posting contract only, mirroring
  # review_simple above.
  - id: review_staff
    name: Review PR (staff)
    type: run_agent
    config:
      role: review
      mode: headless
      # Aligned to simple-task-review's staff pass (which leaves model unset
      # and inherits the sonnet default) — opus x an 11-subagent staff review
      # was the priciest shape in the fleet (review = 34% of spend).
      model: sonnet
      provider: cross
      prompt: >-
        Run /staff-code-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}

        This task is an authorized Sybra PR review for the linked project. Do not
        ask the operator for confirmation before posting your review.

        NEVER submit any review event. You have no approval authority, and a
        human must verify and submit the review on GitHub. Do not run
        `gh pr review`, do not run `gh pr review --approve`, and do not submit
        COMMENT, REQUEST_CHANGES, or APPROVE via `gh api`.

        Create exactly one PENDING (draft) pull-request review and leave it
        unsubmitted. Before creating it, fetch the PR head SHA and existing
        reviews; if a review for that head already contains the Sybra harness
        footer, do not create another review.

        Use GitHub's review API so findings become inline comments, not one
        aggregated comment. Add each blocking correctness issue as a `comments`
        entry on the changed line it applies to. Put only the short verdict and
        summary in the draft review body. If the review is clean and has no
        inline findings, create a pending review with the clean summary body and
        no inline comments.

        Prefer `gh api repos/{{.Task.ProjectID}}/pulls/{{.Task.PRNumber}}/reviews
        -X POST ...` with explicit `-f`/`-F` fields such as
        `comments[][path]`, `comments[][line]`, `comments[][side]=RIGHT`, and
        `comments[][body]`. Omit `event` so GitHub leaves the review PENDING.

        End the review summary and every review comment you post with a blank
        line then exactly this standalone harness attribution footer:

        _Generated by Sybra harness_
    next:
      - goto: set_in_review

  - id: set_in_review
    name: Set In Review
    type: set_status
    config:
      status: in-review
    next:
      - goto: ""
