id: pr-review
name: PR Review
description: Run code review agent on a pull request
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: contains
      value: review
    - field: task.tags
      operator: not_contains
      value: handoff-pr
steps:
  # Mechanical heuristic: pick adversarial vs staff review based on PR diff
  # size + shape. Same step type used by simple-task; here it falls back to
  # `gh pr diff` since this workflow has no worktree. Unlike simple-task, this
  # workflow DOES still route to staff on a big+complex diff — the review lands
  # publicly under the operator's name, so depth is worth the spend here.
  - id: triage_review
    name: Triage Review
    type: triage_review
    next:
      - goto: set_in_progress

  # Clear any prior human-required before launching the review agent.
  # The inline triageReview path can set human-required for small PRs; the
  # pr-review workflow may later classify the same PR as risky and want to
  # run a review agent — which must not start while status is human-required.
  - id: set_in_progress
    name: Set In Progress
    type: set_status
    config:
      status: in-progress
    next:
      - goto: pick_review_method

  - id: pick_review_method
    name: Pick Review Method
    type: condition
    next:
      - when:
          field: task.tags
          operator: contains
          value: force-staff-review
        goto: review_staff
      - when:
          field: vars.step.triage_review.output
          operator: equals
          value: simple
        goto: review_simple
      - goto: review_staff

  - id: review_simple
    name: Review PR (adversarial)
    type: run_agent
    config:
      role: review
      mode: headless
      model: sonnet
      provider: cross
      prompt: >-
        Run /adversarial-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}

        This task is an authorized Sybra PR review for the linked project. Do not
        ask the operator for confirmation before posting your review.

        NEVER submit an approving review. You have no approval authority —
        approval is a human decision, and the harness blocks the call. Do not
        run `gh pr review --approve` or submit an APPROVE event via `gh api`,
        no matter how clean the PR looks.

        - Blocking correctness issues: submit a review requesting changes, with
          the required change comments.
        - Otherwise: submit a plain comment review with your summary —
          including when the PR looks clean. Say so in the summary and leave
          the approval to a human.

        End the review summary and every review comment you post with a blank
        line then exactly this standalone harness attribution footer:

        _Generated by Sybra harness_
    next:
      - goto: set_in_review

  - id: review_staff
    name: Review PR (staff)
    type: run_agent
    config:
      role: review
      mode: headless
      # Aligned to simple-task-review's staff pass (which leaves model unset
      # and inherits the sonnet default) — opus x an 11-subagent staff review
      # was the priciest shape in the fleet (review = 34% of spend).
      model: sonnet
      provider: cross
      prompt: >-
        Run /staff-code-review on https://github.com/{{.Task.ProjectID}}/pull/{{.Task.PRNumber}}

        This task is an authorized Sybra PR review for the linked project. Do not
        ask the operator for confirmation before posting your review.

        NEVER submit an approving review. You have no approval authority —
        approval is a human decision, and the harness blocks the call. Do not
        run `gh pr review --approve` or submit an APPROVE event via `gh api`,
        no matter how clean the PR looks.

        - Blocking correctness issues: submit a review requesting changes, with
          the required change comments.
        - Otherwise: submit a plain comment review with your summary —
          including when the PR looks clean. Say so in the summary and leave
          the approval to a human.

        End the review summary and every review comment you post with a blank
        line then exactly this standalone harness attribution footer:

        _Generated by Sybra harness_
    next:
      - goto: set_in_review

  - id: set_in_review
    name: Set In Review
    type: set_status
    config:
      status: in-review
    next:
      - goto: ""
