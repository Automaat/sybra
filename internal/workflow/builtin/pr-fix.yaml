id: pr-fix
name: PR Fix
description: Fix CI failures or merge conflicts on a PR
builtin: true
trigger:
  on: pr.event
  conditions:
    - field: pr.issue_kind
      operator: in
      value: conflict,ci_failure,comments
steps:
  - id: set_in_progress
    name: Mark In Progress
    type: set_status
    config:
      status: in-progress
    next:
      - goto: fix

  - id: fix
    name: Fix PR Issue
    type: run_agent
    config:
      role: pr-fix
      mode: headless
      model: sonnet
      prompt: >-
        {{ getvar .Vars "prompt" }}
    next:
      - goto: route_pr_fix_result

  # Mechanical check (no LLM): if the pr-fix agent deliberately stopped and
  # requested human review (for example too many merge conflicts), preserve that
  # escalation before PR relinking can move the task back to in-review. Before
  # parking, re-probes the live PR: a stale/diverged local worktree can cause a
  # false human-required when an external bot already pushed a green fix
  # remotely — in that case the step sets in-review itself and ends the
  # workflow here too.
  - id: route_pr_fix_result
    name: Route PR Fix Result
    type: route_pr_fix_result
    next:
      - when:
          field: vars.step.route_pr_fix_result.pr_fix_test_fix_eligible
          operator: equals
          value: "true"
        goto: test_fix
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - when:
          field: vars.step.fix.pr_fix_verdict
          operator: equals
          value: continue
        goto: push_fixed_branch
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ""
      - goto: push_fixed_branch

  # Bounded, single-shot follow-up: route_pr_fix_result redirects here only
  # when the pr-fix agent named specific non-merge test failures instead of
  # parking immediately (see prFixTestFixEligibleVar). Scoped identically to
  # pr-fix itself — fix only the named tests, no new investigation, no
  # unrelated changes. route_test_fix_result (below) makes the final call;
  # it reuses route_pr_fix_result's own step type, so a second human-required
  # verdict here always parks — it can never redirect back to this step.
  - id: test_fix
    name: Fix Reported Test Failures
    type: run_agent
    config:
      role: test-fix
      mode: headless
      model: sonnet
      prompt: >-
        A prior pr-fix agent working this task found these specific test
        failures unrelated to the merge itself and stopped rather than
        freelance outside its scope:


        {{ getvar .Vars "step.fix.pr_fix_failing_tests" }}


        Reported reason: {{ getvar .Vars "step.fix.pr_fix_reason" }}


        Fix ONLY what is needed to make the tests named above pass. No new
        investigation beyond these named failures, no unrelated changes —
        the same scope discipline pr-fix itself follows. Re-run exactly
        those tests (or their containing package, if that is the smallest
        reproducible unit) and confirm they pass before reporting success.
        If fixing them would require more than a narrow, targeted change —
        a design decision, missing context you cannot reconstruct, or
        touching code beyond the named tests — stop without pushing further
        changes and report human-required rather than guessing.


        Once the named tests pass, commit (git commit {{commitsignflags .Vars}}) and push the
        fix back to this same PR branch:

        ```sh
        PUSH_REMOTE=origin
        if git config --get remote.fork.url >/dev/null; then PUSH_REMOTE=fork; fi
        PREFLIGHT_REF=HEAD:refs/heads/sybra-preflight/$(git rev-parse --verify HEAD)
        git push --dry-run "$PUSH_REMOTE" "$PREFLIGHT_REF"
        git push "$PUSH_REMOTE" HEAD:{{.Task.Branch}}
        ```

        Do not force-push or rewrite existing commits — this branch already
        has a PR open against it; a plain push is always expected to
        succeed since you only added a commit on top.
        {{ getvar .Vars "pr_fix_result_contract" }}
    next:
      - goto: route_test_fix_result

  - id: route_test_fix_result
    name: Route Test Fix Result
    type: route_pr_fix_result
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - when:
          field: vars.step.test_fix.pr_fix_verdict
          operator: equals
          value: continue
        goto: push_fixed_branch
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ""
      - goto: push_fixed_branch

  # Agents are asked to push, but their prose is not a publication proof. A
  # successful local fix must pass through the same deterministic, fork-aware,
  # non-force push used by PR creation and branch-conflict recovery before the
  # task returns to review.
  - id: push_fixed_branch
    name: Push Fixed PR Branch
    type: push_branch
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: verify_commits

  # Mechanical check (no LLM): verifies the task's branch has at least one
  # commit ahead of origin/main before running eval. Flips to human-required
  # with reason "no commits pushed to branch" when the branch is empty.
  # Skips gracefully when no worktree exists (e.g. task has no project).
  - id: verify_commits
    name: Verify Commits
    type: verify_commits
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      # Branch identical to base after fix attempt → fix landed via a different
      # branch; verify_commits set status=done and we end the workflow.
      - when:
          field: task.status
          operator: equals
          value: done
        goto: ""
      - goto: detect_tampering

  # Mechanical check (no LLM): the pr-fix agent is under pressure to turn red
  # CI green, the highest-risk context for reward hacking. Scan the diff for
  # test/CI tampering before the PR moves on; a high-severity finding flips the
  # task to human-required. Skips gracefully without a worktree.
  - id: detect_tampering
    name: Detect Test Tampering
    type: detect_tampering
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: link_pr_and_review

  # Non-LLM step: recover PR number from task, agent result history, or
  # gh pr list. Sets task to in-review and skips the LLM eval when a PR
  # is unambiguously found. Falls through to evaluate only when all three
  # sources fail to find a PR.
  - id: link_pr_and_review
    name: Link PR and Review
    type: link_pr_and_review
    next:
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ensure_pr_closes_issue
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: evaluate

  # Mechanical fallback (no LLM): reached only when link_pr_and_review failed
  # to find a PR. Walks step history for the last run_agent record and flips
  # the task to human-required with a truncated reason.
  - id: evaluate
    name: Evaluate Fix
    type: evaluate
    next:
      - goto: ""

  # Mechanical check (no LLM): if the task is linked to a GitHub issue,
  # make sure the PR's body carries a `Closes <issue-url>` reference so
  # merging the PR auto-closes the issue.
  - id: ensure_pr_closes_issue
    name: Ensure PR Closes Issue
    type: ensure_pr_closes_issue
    next:
      - goto: rerequest_review

  # Mechanical check (no LLM): after a PR-fix agent has pushed updated commits,
  # request another review from users whose comments/reviews were addressed.
  - id: rerequest_review
    name: Re-request Review
    type: rerequest_review
    next:
      - goto: ""
