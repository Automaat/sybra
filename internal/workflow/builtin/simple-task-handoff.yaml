kind: handoff_template
trigger:
  on: task.created
variants:
  - id: simple-task-handoff
    name: Simple Task — Handoff
    description: >-
      A task handed off from an external tool (e.g. Orca) that already carries
      the approved plan in its body/plan. Skip triage and planning entirely;
      flip the task straight to in-progress so simple-task-implement runs the
      implementation agent. The cascade in OnWorkflowComplete picks up the
      status_changed event.
    tag: handoff
    exclude_tags:
      - handoff-review
      - handoff-testing
      - handoff-ready-pr
      - review
    step:
      id: set_in_progress
      name: Hand Off to Implement
      status: in-progress
  - id: simple-task-handoff-review
    name: Simple Task — Handoff (Review)
    description: >-
      A task handed off from an external tool (e.g. Orca) that is already
      implemented in its worktree and needs review + manual testing + PR
      creation. Skip triage/planning/implementation; flip straight to
      ready-review so simple-task-review reviews the adopted worktree, then it
      flows through the testing gate (testing-task) and the PR is opened by
      simple-task-pr once tests pass. The cascade in OnWorkflowComplete picks
      up each status_changed event.
    tag: handoff-review
    exclude_tags:
      - review
    step:
      id: set_ready_review
      name: Hand Off to Review
      status: ready-review
  - id: simple-task-handoff-testing
    name: Simple Task — Handoff (Testing)
    description: >-
      A task handed off from an external tool (e.g. Orca) whose feature is
      already implemented and reviewed in its worktree and only needs the
      adversarial testing gate. Skip triage/planning/implementation/review;
      flip straight to testing so testing-task validates the adopted worktree,
      then simple-task-pr opens the PR once tests pass. The cascade in
      OnWorkflowComplete picks up the status_changed event. Primarily a
      manual-testing / demo entry point (`sybra-cli handoff --stage testing`).
    tag: handoff-testing
    exclude_tags:
      - review
    step:
      id: set_testing
      name: Hand Off to Testing
      status: testing
  - id: simple-task-handoff-ready-pr
    name: Simple Task - Handoff (Ready PR)
    description: >-
      A task handed off from an external tool whose feature is already
      implemented, reviewed, and tested in its worktree and only needs PR
      creation/push. Skip triage/planning/implementation/review/testing; flip
      straight to ready-pr so simple-task-pr opens or updates the PR from the
      adopted worktree.
    tag: handoff-ready-pr
    exclude_tags:
      - review
    step:
      id: set_ready_pr
      name: Hand Off to Ready PR
      status: ready-pr
