id: simple-task-plan
name: Simple Task — Plan
description: Triage a new task and (when planning is required) drive the plan / critique / human-review loop. Hands off to simple-task-implement via task.status=in-progress on completion.
builtin: true
trigger:
  on: task.created
  conditions:
    - field: task.tags
      operator: not_contains
      value: review
steps:
  - id: triage
    name: Triage
    type: run_agent
    config:
      role: triage
      mode: headless
      model: sonnet
      max_retries: 3
      prompt: >-
        Triage task {{.Task.ID}} using /sybra-triage skill.
        Get the task with sybra-cli, analyze it, assign tags, mode, and update status.
        IMPORTANT: if the task title is a URL (e.g. a GitHub issue/PR link),
        you MUST fetch the real title from that URL using gh and update the task title
        to a human-readable summary. Never leave a raw URL as the task title.
      allowed_tools:
        - Bash
        - Read
        - Skill
    next:
      # Short-circuit when triage determined the task is already past
      # implementation (e.g. PR already open, escalated, or done). Without
      # these guards the workflow would clobber the status in
      # set_in_progress_and_end and dispatch a duplicate implement step.
      - when:
          field: task.status
          operator: equals
          value: in-review
        goto: ""
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - when:
          field: task.status
          operator: equals
          value: done
        goto: ""
      # noplan escape hatch: skip the plan/critique/human-review pipeline and
      # hand straight to implementation. Checked before the planning route so
      # it wins even if triage set status=planning. The terminal guards above
      # still take precedence, so a noplan task triage finished is not forced
      # into implement.
      - when:
          field: task.tags
          operator: contains
          value: noplan
        goto: set_in_progress_and_end
      - when:
          field: task.status
          operator: equals
          value: planning
        goto: plan
      - goto: set_in_progress_and_end

  # Terminal hand-off to simple-task-implement: flip status to in-progress
  # and complete this workflow. The cascade in OnWorkflowComplete picks up
  # the status_changed event and dispatches simple-task-implement.
  - id: set_in_progress_and_end
    name: Hand Off to Implement
    type: set_status
    config:
      status: in-progress
    next:
      - goto: ""

  # Single plan step: one opus agent convenes the council of experts
  # (/council core-eng) to debate the implementation approach, then synthesizes
  # that debate into the canonical plan sidecar. core-eng is pinned so the
  # skill never reaches its interactive profile-selection (this runs headless).
  # This one step replaces the prior THREE (two parallel plan agents + a
  # /plan-fork converge that re-critiqued the plan); the adversarial review is
  # now solely the codex critique_plan step below.
  - id: plan
    name: Plan
    type: run_agent
    config:
      role: plan
      provider: claude
      mode: headless
      model: opus
      needs_worktree: true
      max_retries: 1
      prompt: >-
        Plan task {{.Task.ID}} by convening the expert council.

        IDENTITY (read first, before anything else):
          - Your task ID is {{.Task.ID}}.
          - Your worktree is your current working directory (`pwd`).
          - Your branch is the checked-out branch
            (`git rev-parse --abbrev-ref HEAD`).
          - For the canonical source of truth, read `./.sybra-context.md` —
            this file is auto-written by Sybra into every task worktree.

        DO NOT reference any other task ID, branch, or worktree path in
        your plan. If `git branch -a` reveals sibling branches like
        `<type>/<other-slug>-<other-id>`, IGNORE them — they belong to
        other concurrent tasks against the same project repo and have
        nothing to do with you.

        Steps:
          1. Run: sybra-cli --json get {{.Task.ID}}
          2. Read the relevant source files so the plan is grounded in the
             real code (name files and symbols you will touch).
          3. Convene the council on the implementation approach: run
             `/council core-eng` and pass it a concise task summary plus the
             approach options you are weighing, grounded in the files you read.
             The personas will debate tradeoffs and surface risks from opposed
             engineering lenses. If /council is unavailable in this
             environment, plan directly using the same multi-lens scrutiny.
          4. Synthesize the council's debate into a single detailed
             implementation plan that names files, symbols (with `path:line`
             references), the ordered steps, and per-step verification
             criteria.
          5. Write the full plan markdown to /tmp/sybra-plan-{{.Task.ID}}.md

        Do NOT call sybra-cli update — Sybra will ingest your file as the
        plan sidecar after you exit. Do NOT modify the task plan field
        directly. Do NOT change the task status.
      allowed_tools:
        - Bash
        - Read
        - Grep
        - Glob
        - Write
        - Skill
        - Agent
      import_sidecar:
        kind: plan
        from: /tmp/sybra-plan-{{.Task.ID}}.md
    next:
      - goto: require_plan

  # Guard: the plan agent can exit cleanly without producing a plan (e.g. the
  # council/plan flow failed or the agent skipped the write). Mirrors
  # require_plan_critique below: flips to human-required so the failure is
  # visible instead of silently advancing into critique_plan with an empty plan.
  - id: require_plan
    name: Require Plan
    type: require_sidecar
    config:
      sidecar: plan
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: validate_plan_refs

  # Cross-task contamination guard: rejects plans that reference branches or
  # worktree paths belonging to OTHER tasks. A plan agent against a shared
  # project repo can confabulate a sibling task's identity (branch/worktree)
  # into the plan; the impl agent then commits to the wrong branch. Flipping
  # to human-required keeps the failure visible.
  - id: validate_plan_refs
    name: Validate Plan References
    type: validate_plan
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: maybe_critique

  # Branch around critique_plan when the task is tagged `nocritic`, and also
  # on replan iterations after a human reject — the plan has already been
  # critiqued and addressed once; re-critiquing each revision just burns
  # tokens and delays the human review loop. `vars.step.review_plan.output`
  # only exists after the wait_human step has produced a verdict, which is
  # the reliable marker for "this is a replan, not the first pass".
  - id: maybe_critique
    name: Critique Decision
    type: condition
    config:
      check:
        field: task.tags
        operator: not_contains
        value: nocritic
    next:
      - when:
          field: vars.step.review_plan.output
          operator: exists
        goto: review_plan
      - when:
          field: task.tags
          operator: not_contains
          value: nocritic
        goto: critique_plan
      - goto: review_plan

  - id: critique_plan
    name: Critique Plan
    type: run_agent
    config:
      role: plan-critic
      mode: headless
      model: sonnet
      provider: cross
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Critique the plan for task {{.Task.ID}} using the /plan-critic skill.

        Steps:
          1. Run: sybra-cli --json get {{.Task.ID}}
          2. Extract the .plan field from the JSON output and write it to
             /tmp/sybra-plan-{{.Task.ID}}.md
          3. Invoke: /plan-critic /tmp/sybra-plan-{{.Task.ID}}.md
          4. Capture the full markdown Plan Review report you produce and
             write it to /tmp/sybra-critique-{{.Task.ID}}.md

        Do NOT modify the plan. Do NOT change the task status. Sybra
        will ingest /tmp/sybra-critique-{{.Task.ID}}.md as the task's
        plan_critique sidecar after you exit — you do not need to call
        sybra-cli yourself.
      allowed_tools:
        - Bash
        - Read
        - Grep
        - Glob
        - Write
        - Skill
        - Agent
      import_sidecar:
        kind: plan_critique
        from: /tmp/sybra-critique-{{.Task.ID}}.md
    next:
      - goto: require_plan_critique

  # Guard: the critic agent above can exit cleanly even when it never
  # produced its output file (e.g. shell blocked by a sandbox). Without
  # this check the workflow silently advances to address_critique with
  # an empty sidecar, and the human sees only the plan — no critique —
  # in the review UI. Flips task to human-required when the sidecar is
  # empty so the failure is visible.
  - id: require_plan_critique
    name: Require Plan Critique
    type: require_sidecar
    config:
      sidecar: plan_critique
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: reset_for_address

  - id: reset_for_address
    name: Reset for Critique Address
    type: set_status
    config:
      status: planning
    next:
      - goto: address_critique

  - id: address_critique
    name: Address Critique
    type: run_agent
    config:
      role: plan
      mode: interactive
      model: opus
      reuse_agent: true
      wait_for_status: plan-review
      prompt: >-
        The plan critic has reviewed your plan for task {{.Task.ID}}.

        Steps:
          1. sybra-cli --json get {{.Task.ID}} — read the .plan_critique field
          2. For each concern raised, revise the plan to address it
          3. sybra-cli update {{.Task.ID}} --plan "<full revised plan markdown>"
          4. sybra-cli update {{.Task.ID}} --status plan-review

        Then STOP and wait. Do NOT implement.
    next:
      - goto: review_plan

  - id: review_plan
    name: Review Plan
    type: wait_human
    config:
      status: plan-review
      human_actions:
        - approve
        - reject
    next:
      - when:
          field: vars.human_action
          operator: equals
          value: approve
        goto: set_in_progress_and_end
      - when:
          field: vars.human_action
          operator: equals
          value: reject
        goto: start_replan

  # Reset status before re-entering `plan` so the plan-review status-change
  # hook fires again when the agent delivers a revised plan. Without this
  # reset the second iteration would already be at plan-review and no
  # transition event would be emitted to advance the workflow.
  - id: start_replan
    name: Prepare Replan
    type: set_status
    config:
      status: planning
    next:
      - goto: plan
