id: testing-task
name: Manual Testing
description: >-
  Adversarially test the implemented feature against the task description by
  running the real app/cluster in an isolated per-task sandbox. Goal: PROVE the
  feature does not behave as the task requires. Pass → ready-pr (a PR is opened).
  Fail → back to in-progress for re-implementation, until the attempt cap, then
  human-required. No human in the loop and no test-plan review.
builtin: true
trigger:
  on: task.status_changed
  conditions:
    - field: task.status
      operator: equals
      value: testing
steps:
  # Escape hatch: a task tagged `notest` (docs, config-only, anything not
  # runnable) skips testing and goes straight to ready-pr so the PR still opens.
  - id: maybe_test
    name: Testing Decision
    type: condition
    next:
      - when:
          field: task.tags
          operator: contains
          value: notest
        goto: skip_testing
      - goto: run_test

  - id: skip_testing
    name: Skip Testing
    type: set_status
    config:
      status: ready-pr
      status_reason: testing skipped (notest) — opening PR
    next:
      - goto: ""

  # A single headless adversarial test-runner. Its sandbox (Docker compose
  # project / k3d cluster, keyed by task id) is started on demand by the agent
  # launcher and exposed via SANDBOX_URL / KUBECONFIG. Concurrency across tasks
  # is capped by config.testing.max_concurrent (default 3); when saturated the
  # step parks and ResumeStalled retries once a slot frees.
  - id: run_test
    name: Adversarial Testing
    type: run_agent
    config:
      role: test-runner
      mode: headless
      model: sonnet
      provider: cross
      needs_worktree: true
      max_retries: 1
      output_schema: >-
        {"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"summary":{"type":"string"}},"required":["verdict"],"additionalProperties":false}
      prompt: >-
        Adversarially test task {{.Task.ID}} using the /sybra-test skill.

        Your goal is to PROVE the implementation does NOT satisfy the task —
        exercise the happy path AND edge cases, boundary inputs, and failure
        modes. You decide how to start and drive the real app/cluster (read the
        repo: README, .sybra.yaml, mise tasks, package.json, compose, Makefile).
        If SANDBOX_URL / KUBECONFIG are set in your environment, an isolated
        sandbox is already running for this task — use it. Bind only ephemeral
        ports and tear down anything you start.

        When done:
          - If you found ANY deviation from the task's intent, append a
            "## Test Failures" section to the task body via
            `sybra-cli update {{.Task.ID}} --body "<full body>"` describing the
            observed-vs-expected symptoms and exact reproduction steps. Do NOT
            suggest fixes — only report what is broken.
          - Print the verdict as the FINAL line of your output, exactly:
            `TEST_VERDICT: PASS`  (only if you could not break it)
            or
            `TEST_VERDICT: FAIL`  (if any case failed)
    next:
      - goto: route_test

  # Non-LLM router: reads run_test's verdict. PASS → ready-pr (simple-task-pr
  # opens the PR). FAIL → in-progress to re-implement, until the per-task
  # attempt cap (config.testing.max_attempts), then human-required.
  - id: route_test
    name: Route Test Result
    type: route_test_result
    next:
      - goto: ""
