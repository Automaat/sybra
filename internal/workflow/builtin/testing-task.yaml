id: testing-task
name: Manual Testing
description: >-
  Adversarially test the implemented feature against the task description by
  running the real app/cluster in an isolated per-task sandbox. Goal: PROVE the
  feature does not behave as the task requires. Pass → ready-pr (a PR is opened).
  Fail → back to in-progress for re-implementation, until the attempt cap, then
  human-required. No human in the loop and no test-plan review.
builtin: true
trigger:
  on: task.status_changed
  conditions:
    - field: task.status
      operator: equals
      value: testing
steps:
  # Every task reaches the tester. `notest`/docs/library scopes only exempt the
  # app start; the test-runner still has to provide CLI/test-harness evidence.
  - id: maybe_test
    name: Testing Decision
    type: condition
    next:
      - goto: run_test

  # A single headless adversarial test-runner. Its sandbox (Docker compose
  # project / k3d cluster, keyed by task id) is started on demand by the agent
  # launcher and exposed via SANDBOX_URL / KUBECONFIG. Concurrency across tasks
  # is capped by config.testing.max_concurrent (default 3); when saturated the
  # step parks and ResumeStalled retries once a slot frees.
  - id: run_test
    name: Adversarial Testing
    type: run_agent
    config:
      role: test-runner
      mode: headless
      model: sonnet
      provider: cross
      needs_worktree: true
      max_retries: 1
      output_schema: >-
        {"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"outcome":{"type":"string","enum":["pass","product_bug","infra_failure","ambiguous_requirement","missing_evidence"]},"failures_markdown":{"type":"string"},"surface_kind":{"type":"string"},"app_started":{"type":"boolean"},"start_command":{"type":"string"},"readiness_probe":{"anyOf":[{"type":"string"},{"type":"object","properties":{"command":{"type":"string"},"expected":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"actual":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"observed":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"output":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"status":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"url":{"type":"string"}},"required":["command"],"anyOf":[{"required":["actual"]},{"required":["observed"]},{"required":["output"]},{"required":["status"]},{"required":["url"]}],"additionalProperties":false}]},"manual_probes":{"anyOf":[{"type":"string"},{"type":"array","items":{"anyOf":[{"type":"string"},{"type":"object","properties":{"command":{"type":"string"},"expected":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"actual":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"observed":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"output":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"status":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]}},"required":["command"],"anyOf":[{"required":["actual"]},{"required":["observed"]},{"required":["output"]},{"required":["status"]}],"additionalProperties":false}]}}]},"automated_checks":{"anyOf":[{"type":"string"},{"type":"array","items":{"anyOf":[{"type":"string"},{"type":"object","properties":{"command":{"type":"string"},"actual":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"observed":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"output":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]},"status":{"anyOf":[{"type":"string"},{"type":"number"},{"type":"boolean"}]}},"required":["command"],"anyOf":[{"required":["actual"]},{"required":["observed"]},{"required":["output"]},{"required":["status"]}],"additionalProperties":false}]}}]},"unable_to_run_reason":{"type":"string"}},"required":["verdict","outcome","failures_markdown","surface_kind","app_started","start_command","readiness_probe","manual_probes","automated_checks","unable_to_run_reason"],"additionalProperties":false}
      prompt: >-
        Adversarially test task {{.Task.ID}} using the /sybra-test skill.

        Your goal is to PROVE the implementation does NOT satisfy the task —
        exercise the happy path AND edge cases, boundary inputs, and failure
        modes. Test ONLY behaviour the task description states or directly
        implies; attack the edges OF those requirements. Do NOT invent new
        requirements the task never stated (e.g. legacy/back-compat behaviour,
        an API the task did not promise) and fail the implementation on them —
        that escalates correct work to a human. If the task's own stated
        requirements contradict each other or are too ambiguous to verify, that
        is not an implementation defect: say so plainly in `## Test Failures`
        and still emit FAIL (a human resolves the spec). You decide how to start
        and drive the real app/cluster (read the repo: README, .sybra.yaml, mise
        tasks, package.json, compose, Makefile).
        {{if .Task.ManualTest.Kind}}This project's .sybra.yaml declares a manual_test surface:
          - kind: {{.Task.ManualTest.Kind}}
          - command: {{.Task.ManualTest.Command}}
          - health_url: {{.Task.ManualTest.HealthURL}}
          - probe_commands:
        {{range .Task.ManualTest.ProbeCommands}}    - {{.}}
        {{end}}Prefer this surface for black-box testing unless the task scope clearly makes it irrelevant.
        {{end}}
        Existing `## Test Failures` sections in the task body are historical
        context only. Reproduce them against the CURRENT worktree before counting
        them; if the current code no longer exhibits that behavior, ignore the
        stale report instead of emitting FAIL.
        If SANDBOX_URL / KUBECONFIG are set in your environment, an isolated
        sandbox is already running for this task — use it. Bind only ephemeral
        ports and tear down anything you start.

        Manual testing is mandatory by default. Before PASS, run at least one
        product-level probe that a user/operator would recognize: start the
        web/server surface and hit it with curl/browser/devtools; run the real
        CLI/workflow command in an isolated temp home/project; use kubectl
        against the sandbox; or drive the desktop task's headless HTTP/server
        equivalent. Automated tests, lint, builds, diff review, and grep are
        support evidence only — they do NOT count as manual testing by
        themselves.

        Exception: for pure refactors, internal-library changes, docs-only work,
        or changes with no runnable product surface, do not force an app start.
        Instead, state the exception in your final PASS summary and run the
        strongest behavioral regression evidence available: a CLI/test harness
        probe (for example go test, package tests, npm run check, or the real
        CLI command) plus grep/invariant probes when useful for sweep wording.
        Static review or grep alone is not enough. If you cannot justify the
        exception from task scope, missing manual testing is missing_evidence
        -> FAIL.
        If manual testing is impossible, say exactly why in your response. In
        JSON output, put the reason in `unable_to_run_reason`; in plain text,
        add `Unable to run manual test: <reason>`.

        Before looking for defects, derive a cheap acceptance probe from the
        task when possible. For sweep/refactor wording like "everywhere",
        "all", "single utility", "unified", or "no raw X remains", run a
        repo-wide grep/test invariant that would catch missed call sites. Include
        that command in the failure report when it fails.

        For each claimed defect you MUST have: (1) a real command you ran
        and its verbatim output, and (2) when claiming a specific code bug,
        a line quoted from the CURRENT file read with Read/cat/grep — not
        from diff memory. Exclude any claimed defect you cannot back with
        both. An ungrounded claim is not a defect. If the runner or provider
        fails before you can gather this evidence, do not invent a product
        failure; report the infrastructure failure plainly.

        When done:
          - Do NOT call `sybra-cli update` or mutate the task. Sybra ingests
            your final report and appends it to the task atomically.
          - If you found ANY deviation from the task's intent, include a
            "## Test Failures" markdown report listing per-defect: the exact
            command run, verbatim output, expected behaviour (cite the task),
            and the quoted code line when relevant. Classify each defect as
            product_bug, infra_failure, ambiguous_requirement, or
            missing_evidence in prose. Do NOT suggest fixes — describe
            symptoms only.
          - Prefer a single JSON object as your final response. Set `verdict`,
            `outcome`, and `failures_markdown`; use `outcome: "pass"` and an
            empty `failures_markdown` on PASS. PASS is valid only with manual
            testing evidence, or with a justified refactor/library/no-surface
            exception plus regression evidence. Probe objects may use `actual`,
            `observed`, `output`, or `status` for the observed result; leave
            unused object fields as empty strings. If you cannot return JSON,
            your
            plain-text PASS must include the same evidence labels:
            `surface_kind`, `app_started`, `start_command`, `readiness_probe`,
            `manual_probes`, `automated_checks`, and `unable_to_run_reason`;
            otherwise it is a tester protocol failure. For plain text, print
            the report, then print the verdict as the FINAL line exactly:
            `TEST_VERDICT: PASS`  (only if you could not break it)
            or
            `TEST_VERDICT: FAIL`  (if any case failed)
    next:
      - goto: route_test

  # Non-LLM router: reads run_test's verdict. PASS → ready-pr (simple-task-pr
  # opens the PR). FAIL → in-progress to re-implement, until the per-task
  # attempt cap (config.testing.max_attempts), then human-required.
  - id: route_test
    name: Route Test Result
    type: route_test_result
    next:
      - goto: ""
