id: simple-task-review
name: Simple Task — Review
description: Triage the review depth, run code review (simple or staff), apply fixes, then hand the task to the testing phase (status → testing). PR creation now lives in simple-task-pr, which runs after testing passes. Triggered by the cascade after simple-task-implement flips status to ready-review.
builtin: true
trigger:
  on: task.status_changed
  conditions:
    - field: task.status
      operator: equals
      value: ready-review
    # This workflow reviews the local diff before a PR exists. If a linked PR
    # task is restored or mirrored at ready-review, leave it to the PR monitor
    # instead of launching another local review agent.
    - field: task.pr_number
      operator: equals
      value: ""
steps:
  # Skip review when tagged noreview/trivial or already reviewed in a prior
  # run. On skip, jump straight to done_review so the task still advances to
  # testing — trivial-tagged tasks then also skip testing (see
  # testing-task.yaml's maybe_test), landing directly on ready-pr.
  - id: maybe_review
    name: Review Decision
    type: condition
    config:
      check:
        field: task.tags
        operator: not_contains
        value: noreview
    next:
      - when:
          field: task.reviewed
          operator: equals
          value: "true"
        goto: done_review
      - when:
          field: task.tags
          operator: contains
          value: trivial
        goto: done_review
      - when:
          field: task.tags
          operator: not_contains
          value: noreview
        goto: triage_review
      - goto: done_review

  # Mechanical heuristic (no LLM): inspects diff size + file shape. Only its
  # "skip" verdict is load-bearing here — the post-implement stage never routes
  # to staff on a size/shape judgement (see pick_review_method). Kept so a
  # zero-net-line diff still short-circuits the review cycle.
  - id: triage_review
    name: Triage Review
    type: triage_review
    next:
      - goto: clear_review_sidecar

  # Every review dispatch must start from a fresh sidecar file.
  # Without this the loop below cannot terminate on a failed round: the sidecar
  # is imported only when the agent succeeds (engine_events.go), and
  # require_code_review only rejects an EMPTY sidecar, so a reviewer that dies
  # after round 1 would leave task.code_review holding round 1's stale
  # NEEDS_FIXES — re-running fix_review against findings it already fixed,
  # forever. Clearing first makes a dead reviewer fail closed into
  # require_code_review -> human-required instead.
  #
  # `rm -f` is exit-0 on a missing file, so first entry (nothing to remove) and
  # a worktree-less run (empty dir, nothing matches) are both no-ops.
  - id: clear_review_sidecar
    name: Clear Stale Review Sidecar
    type: shell
    config:
      command: rm -f .sybra-review-{{.Task.ID}}.md
      dir: '{{getvar .Vars "_dir"}}'
    next:
      - goto: pick_review_method

  # Post-implement review is ALWAYS adversarial. Staff review is reserved for
  # PRs a human is asked to review (pr-review.yaml); running an 11-subagent
  # staff pass on every landing is what made review 34% of fleet spend while
  # the "simple" branch sat dead — triage picked staff on 62 of 62 reviews.
  # Routes:
  #   - task.tags contains force-staff-review → staff (the only route to staff)
  #   - vars.step.triage_review.output equals skip → trivial diff, skip review
  #   - otherwise → /adversarial-review
  - id: pick_review_method
    name: Pick Review Method
    type: condition
    next:
      - when:
          field: task.tags
          operator: contains
          value: force-staff-review
        goto: code_review_staff
      - when:
          field: vars.step.triage_review.output
          operator: equals
          value: skip
        goto: done_review
      - goto: code_review_simple

  # Default review depth for every landing. Writes to the same sidecar path as
  # code_review_staff so fix_review reads either one transparently.
  # /adversarial-review emits `Review Verdict: CLEAN|NEEDS_FIXES` natively, so
  # the mapping below is identity — no verdict translation to get wrong.
  - id: code_review_simple
    name: Code Review (adversarial)
    type: run_agent
    config:
      role: review
      mode: headless
      provider: cross
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Review the changes on the current branch vs origin/main.
        The PR has not been created yet — review the local diff.

        Steps:
          1. git diff origin/main..HEAD > .sybra-diff-{{.Task.ID}}.patch
          2. Run /adversarial-review against that patch and the worktree source
          3. Save the full review to .sybra-review-{{.Task.ID}}.md

        The FIRST line of .sybra-review-{{.Task.ID}}.md MUST be exactly the
        verdict line /adversarial-review emits, copied verbatim:
          - `Review Verdict: CLEAN` when no surviving finding requires a code
            change before PR creation. Style-only comments, simplification
            ideas, unused-code observations that do not affect behavior, and
            optional consistency suggestions stay CLEAN.
          - `Review Verdict: NEEDS_FIXES` when any surviving finding should
            trigger code changes before PR creation.
        This line gates whether a fix-review agent runs next — get it right.

        Do NOT submit anything to GitHub. Sybra will ingest
        .sybra-review-{{.Task.ID}}.md as the code_review sidecar
        after you exit — you do not need to call sybra-cli yourself.
        The review file is git-excluded and remains for the next step (fix_review) to
        read directly.
      import_sidecar:
        kind: code_review
        from: '{{getvar .Vars "_dir"}}/.sybra-review-{{.Task.ID}}.md'
    next:
      - goto: require_code_review

  # Deep review. Same sidecar contract as code_review_simple. Reachable ONLY
  # via the force-staff-review tag — triage no longer routes here. Tag a task
  # when you want the architectural/convention/dead-code lenses that
  # /adversarial-review deliberately drops.
  - id: code_review_staff
    name: Code Review (staff)
    type: run_agent
    config:
      role: review
      mode: headless
      # Routed through the A/B suite (review-expensive) for provider equality.
      # Historically pinned to claude because codex review failed ~2x more often
      # on staff-level diffs (scorecard: 17% vs 9%); uniform weights plus the
      # eval scorecard are expected to re-balance this — watch the review
      # breakdown per provider after rollout.
      provider: ab
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Review the changes on the current branch vs origin/main.
        The PR has not been created yet — review the local diff.

        Steps:
          1. git diff origin/main..HEAD > .sybra-diff-{{.Task.ID}}.patch
          2. Run /staff-code-review against that patch and the worktree source
          3. Save the full review to .sybra-review-{{.Task.ID}}.md

        The FIRST line of .sybra-review-{{.Task.ID}}.md MUST be exactly one
        verdict marker, mapped from /staff-code-review's native verdict:
          - `Review Verdict: CLEAN` for APPROVE, and for
            APPROVE_WITH_COMMENTS only when every comment is low-severity,
            style-only, optional, or non-actionable before PR creation.
          - `Review Verdict: NEEDS_FIXES` for REQUEST_CHANGES, or for
            APPROVE_WITH_COMMENTS when any critical/high/medium severity
            finding should trigger code changes before PR creation.
        This line gates whether a fix-review agent runs next — get it right.

        Do NOT submit anything to GitHub. Sybra will ingest
        .sybra-review-{{.Task.ID}}.md as the code_review sidecar
        after you exit — you do not need to call sybra-cli yourself.
        The review file is git-excluded and remains for the next step (fix_review) to
        read directly.
      import_sidecar:
        kind: code_review
        from: '{{getvar .Vars "_dir"}}/.sybra-review-{{.Task.ID}}.md'
    next:
      - goto: require_code_review

  # Guard: mirrors require_plan_critique in simple-task-plan. Flips task
  # to human-required when the review sidecar is empty (e.g. agent never
  # wrote .sybra-review-…md, or its sandbox blocked the path).
  # Without this, fix_review reads the sidecar file and the GUI never sees what
  # the reviewer wrote.
  - id: require_code_review
    name: Require Code Review
    type: require_sidecar
    config:
      sidecar: code_review
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: route_review_verdict

  # A clean review (zero actionable findings) skips the fix_review agent
  # entirely, saving ~1 wasted agent run per clean-review task — which is
  # nearly every landing.
  #
  # Unlike the plan-side verdict gate this replaced (deleted: it tested for a
  # literal the critic never emitted, so it never fired), the reviewer's
  # verdict format is mandated by this workflow's own review prompt. Keep the
  # prompt and this check in sync — an unenforced format is how the plan-side
  # gate silently rotted.
  - id: route_review_verdict
    name: Route on Review Verdict
    type: condition
    config:
      check:
        field: task.code_review
        operator: starts_with
        value: 'Review Verdict: CLEAN'
    next:
      - when:
          field: task.code_review
          operator: starts_with
          value: 'Review Verdict: CLEAN'
        goto: done_review
      - goto: fix_review

  - id: fix_review
    name: Fix Review Comments
    type: run_agent
    config:
      role: fix-review
      mode: headless
      needs_worktree: true
      max_retries: 2
      prompt: >-
        Read the code review at .sybra-review-{{.Task.ID}}.md

        For each actionable finding (critical/high/medium severity), fix the code.
        Skip low-severity nitpicks and style-only comments.

        When done, commit your changes (do NOT push yet — push happens with PR
        creation). Sign commits with `git commit -s -S`.
        Use conventional commit format: `fix(review): address review comments`.

        Never weaken, skip, delete, or hardcode tests to satisfy a review
        comment — fix the underlying code. Tampering is checked and blocks the
        task.
    next:
      - goto: detect_tampering

  # Mechanical check (no LLM): re-scan the full diff for test/CI tampering after
  # the review-fix agent has added commits (the implement-stage scan only saw
  # the original diff). A high-severity finding flips the task to
  # human-required. Skips gracefully without a worktree.
  #
  # On a clean scan this goes BACK to pick_review_method rather than handing
  # off to testing: the fix agent just rewrote code that no reviewer has seen,
  # and detect_tampering only inspects test/CI tampering, not whether the fix
  # is right or introduced a fresh bug. Re-review until CLEAN shuts that gap.
  #
  # No round cap here, deliberately. A cap would censor the very distribution
  # the review-rounds stat exists to measure (ReviewRoundsByModel in
  # internal/stats), and every round is gated by a fresh reviewer that must
  # reach CLEAN to exit. Backstop is the per-task cost ceiling:
  # agent.max_task_cost_usd is enforced before every dispatch
  # (preflightRunAgentBudget), so a non-converging review/fix cycle ends at
  # the task's budget rather than never terminating. Operators who want the
  # old single-pass posture set agent.review_until_clean: false, which routes
  # straight to testing after the first fix.
  #
  # A backward goto to a sync step is safe because the run_agent steps in the
  # cycle are async: each agent completion re-enters executeSteps with a fresh
  # `visited` set, so no sync step repeats within one pass and the CycleError
  # guard never trips.
  - id: detect_tampering
    name: Detect Test Tampering
    type: detect_tampering
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - when:
          field: config.review_until_clean
          operator: equals
          value: "false"
        goto: done_review
      - goto: clear_review_sidecar

  # Hand the reviewed (and fixed) branch to the testing phase. The PR is NOT
  # created here — testing-task validates the feature first, then simple-task-pr
  # opens the PR only once tests pass. A task tagged `notest` may skip app
  # startup, but still needs CLI/test-harness evidence before PASS.
  - id: done_review
    name: Hand to Testing
    type: set_status
    config:
      status: testing
      status_reason: code reviewed — running manual tests
    next:
      - goto: ""
