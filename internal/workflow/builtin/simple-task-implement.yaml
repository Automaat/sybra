id: simple-task-implement
name: Simple Task — Implement
description: Run the implementation agent and verify commits. Triggered by the cascade after simple-task-plan flips status to in-progress; hands off to simple-task-review via task.status=ready-review on completion.
builtin: true
trigger:
  on: task.status_changed
  conditions:
    - field: task.status
      operator: equals
      value: in-progress
    - field: task.tags
      operator: not_contains
      value: review
steps:
  - id: implement
    name: Implement
    type: run_agent
    config:
      role: implementation
      mode: "{{.Task.AgentMode}}"
      model: sonnet
      max_retries: 2
      prompt: >-
        Implement this task. When done, commit your work and push the branch to
        origin. Do NOT create a PR yet — the PR will be created after local code
        review and manual testing pass, so fixes land in the same branch before
        it is opened.

        For full task context, run `sybra-cli get --compact {{.Task.ID}}`.
        {{- if currenttestfailures .Task.Body}}

        A prior implementation FAILED adversarial manual testing. Fix the root
        cause of every defect reported below (not just the symptom) — the
        feature will be re-tested after this run.

        ## Current Test Failures

        {{currenttestfailures .Task.Body}}
        {{- end}}

        Before committing broad/sweep changes ("everywhere", "all", "single
        utility", "unified", "no raw X remains"), derive and run a cheap
        acceptance probe such as a repo-wide `rg` invariant that would catch
        missed call sites. If the task has a plan contract, follow its files,
        steps, verification commands/manual checks, and acceptance criteria as
        the primary implementation contract. For every manual verification
        item, perform the check and include the observed evidence in your final
        response; if you cannot perform it, stop and mark the task
        human-required with the blocker.

        Never weaken, skip, delete, comment out, or hardcode tests, snapshots,
        or fixtures to make checks pass, and never edit CI config to neuter a
        gate. If an existing test is genuinely wrong, fix it correctly and
        explain why in the commit message — do not silently disable it.
        Tampering is detected mechanically and will block the task.

        Before finishing, re-check your change against a short checklist:
        tests updated, edge cases covered, no leftover debug code.
        {{- if .Task.PlanContract}}

        ## Executable Plan Contract

        ```json
        {{plancontractjson .Task.PlanContract .Task.ID}}
        ```
        {{- else if .Task.Plan}}

        ## Plan

        {{.Task.Plan}}
        {{- end}}
    next:
      # Watchdog stop (or any other pre-completion escalation) sets
      # human-required before the agent exits; stop the workflow here
      # instead of advancing into verify_commits on partial work.
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: verify_commits

  # Mechanical check (no LLM): verifies the task's branch has at least one
  # commit ahead of origin/main before handing off to review. Flips to
  # human-required with reason "no commits pushed to branch" when the branch
  # is empty. Skips gracefully when no worktree exists (e.g. task has no
  # project).
  - id: verify_commits
    name: Verify Commits
    type: verify_commits
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      # Branch identical to base after rebase → fix already on origin from a
      # prior merge; verify_commits set status=done and we end the workflow
      # instead of re-flipping to ready-review.
      - when:
          field: task.status
          operator: equals
          value: done
        goto: ""
      - goto: detect_tampering

  # Mechanical check (no LLM): inspects the worktree diff for reward-hacking /
  # test-tampering signals — deleted assertions, added skip/xfail markers,
  # deleted test files, neutered CI config. A high-severity finding flips the
  # task to human-required (with the offending rules in the reason) so it
  # cannot reach done without an explicit human bless. Benign test changes are
  # recorded in a tamper-report.json artifact but do not block. Skips
  # gracefully when no worktree exists or no verification files changed.
  - id: detect_tampering
    name: Detect Test Tampering
    type: detect_tampering
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: verify_checks

  # Mechanical check (no LLM): run the project's `checks.verify` suite on the
  # agent's branch HEAD before review. A non-zero exit flips the task to
  # human-required so an implementation that does not pass its own declared
  # tests cannot reach a PR. Complements detect_tampering (which catches
  # structural test tampering). Opt-in: a no-op unless the project defines
  # checks.verify. No git mutation; add the `verify-blessed` tag to override a
  # known-flaky suite.
  - id: verify_checks
    name: Verify Checks
    type: verify_checks
    next:
      - when:
          field: task.status
          operator: equals
          value: human-required
        goto: ""
      - goto: set_ready_review

  # Terminal hand-off to simple-task-review: flip status to ready-review
  # and complete this workflow. The cascade in OnWorkflowComplete picks up
  # the status_changed event and dispatches simple-task-review.
  - id: set_ready_review
    name: Hand Off to Review
    type: set_status
    config:
      status: ready-review
    next:
      - goto: ""
